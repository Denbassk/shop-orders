# fly.toml app configuration file generated for shop-orders on 2026-10-19T09:57:05+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shop-orders'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  EXPORT_TARGET = 'live'
  INTERNAL_TICK = 'on'
  IMPORT_SHEETS_TODAY = 'on'
  PULT_STORE_EDIT = 'on'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
