<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Пульт Фемелі Маркет</title>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#F1F2F4;color:#16181D;font-size:16px;line-height:1.45;
  font-family:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;letter-spacing:-.015em}
button{font-family:inherit;font-size:inherit;color:inherit}

/* --- шапка --- */
.hdr{position:sticky;top:0;z-index:20;background:#16181D;color:#fff;
  padding:14px 16px 18px;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:23px;font-weight:800;line-height:1.2}
.hdr .sub{font-size:13px;color:#A6ACB6;margin-top:5px}
.icobtn{flex:none;width:46px;height:46px;border:0;border-radius:15px;background:#2C2F36;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.icobtn:active{background:#3A3E47}

/* --- каркас --- */
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
.grid{display:flex;flex-direction:column;gap:26px}
.sec{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:#7A828E;margin:0 0 12px 4px}
.card{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(22,24,29,.09);overflow:hidden}
.card + .card{margin-top:12px}

/* --- строка списка --- */
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;
  padding:15px 16px;border:0;background:#fff;text-align:left;cursor:pointer;position:relative}
.item + .item::before{content:'';position:absolute;left:16px;right:0;top:0;height:1px;background:#EEF0F3}
.item:active{background:#F7F8FA}
.t{display:block;font-size:16px;font-weight:600;line-height:1.3}
.s{display:block;font-size:13.5px;color:#7A828E;margin-top:6px;line-height:1.4}
.grow{flex-grow:1;min-width:0}
.chev{flex:none;color:#C2C7CE}
.right{flex:none;font-size:15px;font-weight:600;text-align:right}

/* --- направление --- */
.dir{display:block;width:100%;border:0;background:#fff;border-radius:20px;padding:16px;
  box-shadow:0 1px 3px rgba(22,24,29,.09);cursor:pointer;text-align:left}
.dir + .dir{margin-top:12px}
.dir:active{background:#F7F8FA}
.dirtop{display:flex;align-items:center;gap:14px}
.sq{flex:none;width:46px;height:46px;border-radius:14px;color:#fff;font-size:19px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.bar{flex-grow:1;height:8px;border-radius:5px;background:#EDEFF2;overflow:hidden;display:block}
.bar i{display:block;height:8px;border-radius:5px}

.pill{flex:none;font-size:12px;font-weight:600;border-radius:10px;padding:7px 11px;white-space:nowrap}
.pill.open{color:#166B3A;background:#E6F4EC}
.pill.closed{color:#8E1418;background:#FDECEC}
.pill.warn{color:#6B4A00;background:#FFF3DC}
.pill.off{color:#4A5058;background:#E7E9ED}

/* --- кнопки --- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;
  border:0;border-radius:16px;background:#E11B22;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn:active{background:#C4161C}
.btn.dark{background:#16181D}
.btn.ghost{background:#fff;color:#16181D;box-shadow:0 1px 3px rgba(22,24,29,.09);height:52px;font-weight:600}
.btn[disabled]{background:#C9CCD2;cursor:default}
.btn + .btn{margin-top:12px}

/* --- поля и чипы --- */
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid #DCE0E5;border-radius:24px;padding:12px 17px;font-size:14.5px;font-weight:500;
  background:#fff;cursor:pointer}
.chip.on{background:#16181D;color:#fff;border-color:#16181D;font-weight:600}
input[type=search],input[type=text],input[type=tel]{width:100%;padding:16px;border:1px solid #DCE0E5;
  border-radius:16px;background:#fff;font-family:inherit;font-size:16px;color:#16181D;outline:none}
input:focus{border-color:#16181D}

/* --- плашки --- */
.note,.bad,.ok{border-radius:18px;padding:16px;font-size:14.5px;line-height:1.5}
.note{background:#FFF7E6;border:1px solid #F0D49A;color:#6B4A00}
.bad{background:#FDF2F2;border:1px solid #F3C3C5;color:#8E1418}
.ok{background:#E6F4EC;border:1px solid #B5DCC4;color:#14602F}
.info{background:#fff;border-radius:20px;padding:18px 16px;font-size:15px;line-height:1.55;
  box-shadow:0 1px 3px rgba(22,24,29,.09)}
.spin{padding:56px 16px;text-align:center;color:#7A828E;font-size:15px}

/* --- нижние вкладки --- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #E4E6EA;
  padding:9px 6px calc(12px + env(safe-area-inset-bottom));display:flex;max-width:560px;margin:0 auto}
.tab{flex-grow:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 0;color:#7A828E;font-size:11.5px;font-weight:500;cursor:pointer}
.tab.on{color:#E11B22;font-weight:600}

/* --- подтверждение --- */
.mask{position:fixed;inset:0;z-index:50;background:rgba(12,14,18,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;
  padding:12px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(12,14,18,.3)}
.grip{width:46px;height:5px;border-radius:3px;background:#DCE0E5;margin:0 auto 18px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:8px}
.sheet .sub{font-size:14.5px;color:#5A626D;margin-bottom:18px}
.what{background:#F6F7F9;border-radius:18px;padding:16px;margin-bottom:20px}
.what div{display:flex;gap:10px;font-size:15px;line-height:1.45}
.what div + div{margin-top:12px;padding-top:12px;border-top:1px solid #E9EBEF}

label.pick{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;position:relative}
label.pick + label.pick::before{content:'';position:absolute;left:16px;right:0;top:0;height:1px;background:#EEF0F3}
label.pick input{width:24px;height:24px;accent-color:#E11B22;flex:none}

/* --- вход --- */
.login{max-width:400px;margin:0 auto;padding:18vh 24px}
.login h1{font-size:30px;font-weight:800;margin-bottom:6px}
.pin{letter-spacing:.4em;text-align:center;font-size:26px;font-weight:600}
</style>
<script>try{var t=localStorage.getItem('buyer_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}</script>
</head>
<body>

<div id="login" class="login">
  <h1>Пульт</h1>
  <div style="color:#5A626D;font-size:15px;margin-bottom:28px">Фемели Маркет · управление заказами</div>
  <input id="pin" class="pin" type="tel" inputmode="numeric" autocomplete="off" placeholder="····">
  <div id="pinerr" style="color:#B3261E;font-size:14px;margin:12px 4px 0;min-height:20px"></div>
  <button class="btn" onclick="doLogin()">Войти</button>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <button id="back" class="icobtn" style="display:none" onclick="goBack()" aria-label="Назад">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="grow">
      <h1 id="title">Сегодня</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="icobtn" onclick="load()" aria-label="Обновить">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div class="wrap"><div class="grid" id="view"><div class="spin">Загрузка…</div></div></div>

  <div class="tabs">
    <button class="tab on" id="t-today" onclick="tabGo('today')">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>Сегодня</button>
    <button class="tab" id="t-stores" onclick="tabGo('stores')">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1 11H5z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>Точки</button>
    <button class="tab" id="t-restore" onclick="tabGo('restore')">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Бэкап</button>
    <button class="tab" id="t-log" onclick="tabGo('log')">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>Журнал</button>
  </div>
</div>

<div id="modal"></div>

<style>
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis div{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(22,24,29,.09)}
.kpis i{display:block;font-style:normal;font-size:12.5px;color:#7A828E;font-weight:500}
.kpis b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.wodoc{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(22,24,29,.09);overflow:hidden}
.wodoc + .wodoc{margin-top:12px}
.wodoc .h{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:#FAFBFC;border-bottom:1px solid #EEF0F3}
.wodoc .r{display:flex;gap:12px;padding:9px 16px;font-size:14.5px}
.wodoc .r .g{flex-grow:1;min-width:0}
.wodoc .r .q{color:#7A828E;white-space:nowrap}
.minibar{display:block;height:6px;border-radius:4px;background:#EDEFF2;margin-top:8px;overflow:hidden}
.minibar i{display:block;height:6px;border-radius:4px;background:#AD1457}
</style>
<script>
// ================= СПИСАНИЯ (WriteOff.gs) =================
// Отдельный пункт на главной: аналитика по всем юрлицам, таблицы, действия.
var WO_C = '#AD1457';
var WA = { period: 'month', ent: '' };
var WO_PERIODS = [['today', 'Сегодня'], ['yesterday', 'Вчера'], ['week', '7 дней'],
                  ['month', 'Этот месяц'], ['prev', 'Прошлый месяц']];

function woMoney(n) {
  var s = (Math.round((n || 0) * 100) / 100).toFixed(2).replace(/\.00$/, '');
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function woLink(href, title, sub) {
  return '<a class="item" href="' + attr(href) + '" target="_blank" rel="noopener" ' +
    'style="text-decoration:none;color:inherit"><span class="grow"><span class="t">' + esc(title) + '</span>' +
    (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span>' + CHEV + '</a>';
}
function woPill(d) {
  return d.openedAll ? '<span class="pill warn">Открыто всем</span>'
       : (d.closed ? '<span class="pill closed">Закрыто</span>' : '<span class="pill open">Открыто</span>');
}

// --- плашка на главной ---
function woBriefSlot() {
  return section('Списания', '<div id="wobrief"><button class="dir" onclick="go(\'wo\',{})">' +
    woBriefTop('выпечка и кулинария', '') + '<span class="s" style="margin-top:14px">Загрузка…</span></button></div>');
}
function woBriefTop(sub, pill) {
  return '<span class="dirtop"><span class="sq" style="background:' + WO_C + '">С</span>' +
    '<span class="grow"><span class="t" style="font-size:17px;font-weight:700;display:block">Списания</span>' +
    '<span class="s" style="display:block">' + sub + '</span></span>' + pill + '</span>';
}
function woBriefFill() {
  call('woBrief').then(function (d) {
    var el = document.getElementById('wobrief');
    if (!el) return;
    var body = !d.books
      ? '<span class="s" style="margin-top:14px;color:#8E1418">Таблицы списаний ещё не созданы — нажмите, чтобы создать</span>'
      : '<span style="display:flex;gap:12px;margin-top:14px">' +
          '<span class="grow"><span class="s" style="margin:0">Сегодня подано</span>' +
          '<span style="font-size:17px;font-weight:700">' + d.todayDocs + ' · ' + woMoney(d.todaySum) + ' грн</span></span>' +
          '<span class="grow"><span class="s" style="margin:0">За месяц</span>' +
          '<span style="font-size:17px;font-weight:700">' + woMoney(d.monthSum) + ' грн</span></span></span>';
    el.innerHTML = '<button class="dir" onclick="go(\'wo\',{})">' +
      woBriefTop('выпечка и кулинария · до ' + esc(d.deadline) +
                 (d.todayStores ? ' · точек сегодня ' + d.todayStores : ''), woPill(d)) + body + '</button>';
  }, function () {});
}

// --- экран "Списания" ---
function woChips() {
  return '<div class="chips">' + WO_PERIODS.map(function (p) {
    return '<button class="chip' + (WA.period === p[0] ? ' on' : '') + '" onclick="woSetPeriod(\'' + p[0] + '\')">' +
      esc(p[1]) + '</button>';
  }).join('') + '</div>';
}
function woSetPeriod(p) { WA.period = p; load(); }
function woSetEnt(e) { WA.ent = e; load(); }

function loadWo() {
  setHead('Списания', 'выпечка и кулинария');
  view(woChips() + '<div id="wores" class="grid"><div class="spin">Считаю…</div></div>');
  call('woStats', { period: WA.period, edrpou: WA.ent }).then(function (d) {
    var el = document.getElementById('wores');
    if (!el || S.screen !== 'wo') return;
    setHead('Списания', d.periodTitle + ': ' + (d.from === d.to ? d.from : d.from + ' — ' + d.to));
    var h = '';

    if (d.books.length > 1) {
      h += '<div class="chips" style="margin-bottom:0"><button class="chip' + (WA.ent ? '' : ' on') +
        '" onclick="woSetEnt(\'\')">Все юрлица</button>' + d.books.map(function (b) {
          return '<button class="chip' + (WA.ent === b.edrpou ? ' on' : '') + '" onclick="woSetEnt(\'' +
            b.edrpou + '\')">' + esc(b.name) + '</button>';
        }).join('') + '</div>';
    }

    if (!d.books.length)
      h += '<div class="bad">Таблиц списаний ещё нет — продавцы не смогут подать списание. ' +
           'Нажмите «Создать таблицы» внизу.</div>';
    d.missing.forEach(function (m) {
      h += '<div class="bad">Нет таблицы для <b>ЕГРПОУ ' + esc(m.edrpou) + '</b> — ' + m.stores.length +
        ' точек не смогут подать списание: ' + esc(m.stores.slice(0, 6).join(', ')) +
        (m.stores.length > 6 ? '…' : '') + '. Нажмите «Создать таблицы» внизу.</div>';
    });
    if (!d.costCol)
      h += '<div class="note">Сумма считается по <b>продажной цене</b>: в листе «Ассортимент» выпечки нет ' +
           'колонки «Себестоимость». Запустите w04_addCostColumn() или добавьте колонку с таким заголовком — новые списания сразу пойдут по себестоимости.</div>';
    else if (d.noCost && d.noCost.length)
      h += '<div class="note">Продавцам доступно <b>' + d.prodCount + '</b> товаров — только с заполненной себестоимостью. ' +
           'Без себестоимости (их не видно): ' + esc(d.noCost.slice(0, 12).join(', ')) +
           (d.noCost.length > 12 ? ' и ещё ' + (d.noCost.length - 12) : '') +
           '. Впишите себестоимость в «Ассортимент» — появятся у продавцов в течение 10 минут.</div>';

    h += '<div class="kpis">' +
      '<div><i>Сумма</i><b>' + woMoney(d.total) + ' грн</b></div>' +
      '<div><i>Количество</i><b>' + d.qty + ' шт</b></div>' +
      '<div><i>Подач</i><b>' + d.docs + '</b></div>' +
      '<div><i>Точек списывали</i><b>' + d.storesCount + ' из ' + d.storesAll + '</b></div></div>';

    h += '<div class="info" style="display:flex;align-items:center;gap:12px"><span class="grow">Приём списаний ' +
      (d.openedAll ? 'открыт <b>до конца дня</b>' : (d.closed ? '<b>закрыт</b> до завтра' : 'открыт')) +
      ' · дедлайн ' + esc(d.deadline) + ' ежедневно<br><span style="color:#7A828E;font-size:13.5px">' +
      'Продавец удаляет своё списание до ' + esc(d.deadline) + ' в день подачи. В архив — старше ' +
      d.keepDays + ' дней.</span></span>' + woPill(d) + '</div>';

    if (d.books.length) {
      var maxE = Math.max.apply(null, d.books.map(function (b) { return b.sum; }).concat([1]));
      h += section('По юрлицам', '<div class="card">' + d.books.map(function (b) {
        return '<div class="item"><span class="grow"><span class="t">' + esc(b.name) + '</span>' +
          '<span class="s">ЕГРПОУ ' + esc(b.edrpou) + ' · точек сейчас ' + b.storesNow + ' · списывали ' + b.active + ' · ' + b.qty + ' шт</span>' +
          '<span class="minibar"><i style="width:' + Math.round(b.sum / maxE * 100) + '%"></i></span></span>' +
          '<span class="right">' + woMoney(b.sum) + ' грн</span></div>';
      }).join('') + '</div>');
    }

    if (d.stores.length) {
      var maxS = d.stores[0].sum || 1;
      h += section('По точкам (' + d.stores.length + ')', '<div class="card">' + d.stores.map(function (s) {
        var moved = s.nowEdrpou && s.nowEdrpou !== s.edrpou;
        var sub = (s.code ? '№ ' + esc(s.code) + ' · ' : '') + 'подач ' + s.docs + ' · ' + s.qty + ' шт' +
          ' · ЕГРПОУ ' + esc(s.edrpou) +
          (moved ? ' <b style="color:#6B4A00">→ теперь ' + esc(s.nowEdrpou) + '</b>' : '') +
          '<span class="minibar"><i style="width:' + Math.round(s.sum / maxS * 100) + '%"></i></span>';
        return item(s.label, sub, woMoney(s.sum) + ' грн', 'go(\'wostore\',{store:\'' + attr(s.id) + '\'})', s.ua);
      }).join('') + '</div>');
    } else {
      h += '<div class="info">За этот период списаний нет.</div>';
    }

    if (d.products.length) {
      h += section('Топ товаров', '<div class="card">' + d.products.map(function (p) {
        return '<div class="item" style="min-height:56px"><span class="grow"><span class="t" style="font-size:15px">' +
          esc(p.name) + '</span><span class="s">' + esc(p.cat) + ' · ' + p.qty + ' шт</span></span>' +
          '<span class="right">' + woMoney(p.sum) + ' грн</span></div>';
      }).join('') + '</div>');
    }

    if (d.days.length > 1) {
      var maxD = Math.max.apply(null, d.days.map(function (x) { return x.sum; }).concat([1]));
      h += section('По дням списания', '<div class="card">' + d.days.map(function (x) {
        return '<div class="item" style="min-height:52px;padding:12px 16px"><span style="flex:none;width:92px;font-size:14.5px;font-weight:600">' +
          esc(x.date) + '</span><span class="bar"><i style="width:' + Math.round(x.sum / maxD * 100) +
          '%;background:' + WO_C + '"></i></span><span class="right" style="min-width:92px">' +
          woMoney(x.sum) + ' грн</span></div>';
      }).join('') + '</div>');
    }

    if (d.silent.length) {
      h += section('Не списывали за период (' + d.silent.length + ')',
        '<div class="info" style="font-size:14px;color:#5A626D">' + esc(d.silent.join(' · ')) + '</div>');
    }

    var files = '';
    d.books.forEach(function (b) {
      files += woLink(b.url, 'Таблица ' + b.name, 'Google Таблица: «Списания», «Архив», «Сводная»');
      if (b.xlsx) files += woLink(b.xlsx, 'Excel ' + b.name, 'только лист «Списания»');
    });
    if (files) h += section('Таблицы юрлиц', '<div class="card">' + files + '</div>');

    h += section('Управление', '<div class="card">' +
      (d.openedAll
        ? item('Вернуть обычный режим', 'приём снова закрывается в ' + esc(d.deadline), '', 'askWoOpen(false)')
        : item('Открыть приём до конца дня', 'сегодня дедлайн ' + esc(d.deadline) + ' не действует', '', 'askWoOpen(true)')) +

// --- списания одной точки ---
function loadWoStore(id) {

    if (d.bookUrl) h += '<div class="card">' + woLink(d.bookUrl, 'Открыть таблицу юрлица', 'Google Таблица') + '</div>';
    if (!d.docs.length) h += '<div class="info">За этот период списаний нет.</div>';

        (doc.sheet === 'Архив' ? ' · в архиве' : '') + '</span></span>' +

        doc.items.map(function (it) {

            ' × ' + woMoney(it.price) + ' = ' + woMoney(it.sum) + '</span></div>';
        }).join('') +
        '<div style="padding:8px 16px 14px"><button class="btn ghost" style="height:46px;color:#B3261E" ' +
        'onclick="askWoDelete(' + i + ')">Удалить это списание</button></div></div>';
    });

}

// --- действия ---
function askWoDelete(i) {

function askWoOpen(on) {

                'Завтра снова действует дедлайн']
             : ['Приём снова закрывается в дедлайн', 'Поданные списания остаются на месте'],
    yes: on ? 'Открыть' : 'Вернуть',
    run: function () { return call('woOpen', { on: on }); },

}
function askWoArchive() {
  confirmSheet({
    title: 'Перенести в архив?', sub: 'Списания',
    what: ['Строки, где дата списания старше месяца, переедут на лист «Архив» той же таблицы',
           'Ничего не удаляется — аналитика за прошлые месяцы их видит',
           'Продавцы перестанут видеть их в «Мої списання»'],
    yes: 'Перенести',
    run: function () { return call('woArchive'); },
    done: function (r) { toast('Перенесено строк: ' + r.moved); apply('wo', {}); }
  });
}
function askWoSetup() {
  confirmSheet({
    title: 'Создать таблицы?', sub: 'Списания',
    what: ['Для каждого ЕГРПОУ из колонки T Довідника будет своя Google Таблица',
           'Уже созданные таблицы не трогаются, только оформление',
           'Таблицы появятся на Google Диске владельца скрипта'],
    yes: 'Создать',
    run: function () { return call('woSetup'); },
    done: function (r) {
      var n = r.filter(function (x) { return x.created; }).length;
      toast(n ? 'Создано таблиц: ' + n : 'Все таблицы уже есть');
      apply('wo', {});

}

<script>
var TOKEN = '';
try { TOKEN = localStorage.getItem('adm_token') || ''; } catch (e) {}

var S = { screen: 'today', dir: '', store: null, q: '', today: '', busy: false };
var HIST = [];

var DIRS = {
  bakery: { t: 'Выпечка и кулинария', short: 'Выпечка', s: 'В', c: '#E65100' },
  bread:  { t: 'Хлеб Рома',           short: 'Рома',    s: 'Р', c: '#8D6E63' },
  nbhz:   { t: 'Хлеб НБХЗ',           short: 'НБХЗ',    s: 'Н', c: '#5D4037' },
  veg:    { t: 'Овощи и фрукты',      short: 'Овощи',   s: 'О', c: '#2E7D32' }
};
var ORDER = ['bakery', 'bread', 'nbhz', 'veg'];
var CHEV = '<span class="chev"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function attr(s) { return esc(s).replace(/\|/g, ''); }

// ===== БЫСТРЫЙ ПУЛЬТ: кеш экранов + фоновое обновление + предзагрузка =====
// Каждый вызов сервера стоит 1-3 с на связь, поэтому экран показывается
// из сохранённого сразу, а свежие данные приходят фоном.
var SWR_READ = { today: 1, dirStores: 1, stores: 1, store: 1, schedule: 1, log: 1,
                 woBrief: 1, woStats: 1, woStore: 1 };
var SWR_MAX_AGE = 10 * 60 * 1000;   // старше - не показываем, ждём сервер
var SWR_FRESH = 8000;               // столько после ответа сервера не переспрашиваем
var SWR_LS = 'adm_swr_v1';
var SWR = {}, SWR_BUSY = {}, SWR_RT = 0, SWR_PREFETCH_AT = 0;

function swrDay() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function swrLoad() {
  try {
    var o = JSON.parse(localStorage.getItem(SWR_LS) || 'null');
    if (o && o.day === swrDay() && o.c) SWR = o.c;
  } catch (e) {}
}
function swrSave() {
  try { localStorage.setItem(SWR_LS, JSON.stringify({ day: swrDay(), c: SWR })); }
  catch (e) { try { localStorage.removeItem(SWR_LS); } catch (e2) {} }
}
function swrClear() { SWR = {}; SWR_PREFETCH_AT = 0; try { localStorage.removeItem(SWR_LS); } catch (e) {} }
function swrKey(a, p) { return a + '|' + JSON.stringify(p || {}); }
function swrSig() {
  return JSON.stringify([S.screen, S.dir, S.store, S.q, HIST.length,
    typeof WA === 'object' ? WA.period + WA.ent : '']);
}
function swrPut(k, d) { SWR[k] = { t: Date.now(), d: d }; swrSave(); }

function swrRerender(sig) {
  clearTimeout(SWR_RT);
  SWR_RT = setTimeout(function () {
    var a = document.activeElement;
    // за 150 мс могли уйти на другой экран - проверяем ещё раз
    if (sig !== swrSig() || S.busy || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    var y = window.scrollY || 0;
    try { load(); } catch (e) {}
    setTimeout(function () { try { window.scrollTo(0, y); } catch (e) {} }, 60);
  }, 150);
}

function swrPrefetch() {
  if (Date.now() - SWR_PREFETCH_AT < 60000) return;
  SWR_PREFETCH_AT = Date.now();
  var calls = ORDER.map(function (k) { return { a: 'dirStores', p: { dir: k } }; });
  calls.push({ a: 'stores', p: { q: '' } });
  callNet('batch', { calls: calls }).then(function (res) {
    (res || []).forEach(function (r, i) {
      if (r && r.ok) SWR[swrKey(calls[i].a, calls[i].p)] = { t: Date.now(), d: r.data };
    });
    swrSave();
  }, function () {});
}

function swrRefresh(a, p, k, sig) {
  if (SWR_BUSY[k]) return;
  SWR_BUSY[k] = 1;
  var old = JSON.stringify(SWR[k] && SWR[k].d);
  callNet(a, p).then(function (d) {
    delete SWR_BUSY[k];
    swrPut(k, d);
    if (a === 'today') swrPrefetch();
    if (JSON.stringify(d) !== old && sig === swrSig()) swrRerender(sig);
  }, function () { delete SWR_BUSY[k]; });
}

function call(action, payload) {
  payload = payload || {};
  if (!SWR_READ[action] || (action === 'store' && S.screen === 'edit')) {
    return callNet(action, payload).then(function (d) {
      if (!SWR_READ[action] && action !== 'health' && action !== 'batch') swrClear();
      return d;
    });
  }
  var k = swrKey(action, payload), c = SWR[k], now = Date.now();
  if (c && now - c.t < SWR_MAX_AGE) {
    if (now - c.t > SWR_FRESH) swrRefresh(action, payload, k, swrSig());
    return Promise.resolve(c.d);
  }
  return callNet(action, payload).then(function (d) {
    swrPut(k, d);
    if (action === 'today') swrPrefetch();
    return d;
  });
}
swrLoad();

var PERF = [];
function perfLog(action, t0, r) {
  var total = Date.now() - t0;
  var srv = (r && typeof r.ms === 'number') ? r.ms : null;
  PERF.unshift({ a: action, total: total, srv: srv, at: new Date().toTimeString().slice(0, 8) });
  if (PERF.length > 30) PERF.length = 30;
  try { console.log('[perf] ' + action + ': всего ' + total + ' мс' +
    (srv != null ? ', сервер ' + srv + ', связь/запуск ' + (total - srv) : '')); } catch (e) {}
}
function callNet(action, payload) {
  var t0 = Date.now();
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) {
        perfLog(action, t0, r);
        if (r && r.ok) return res(r.data);
        if (r && r.error === 'AUTH') { logout(); return rej(new Error('Нужно войти заново')); }
        rej(new Error((r && r.error) || 'Ошибка связи'));
      })
      .withFailureHandler(function (e) { perfLog(action, t0, null); rej(e); })
      .adminApi(action, payload || {}, TOKEN);
  });
}

// ================= ВХОД =================
function logout() {
  TOKEN = '';
  try { localStorage.removeItem('adm_token'); } catch (e) {}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}

function doLogin() {
  var pin = document.getElementById('pin').value;
  var err = document.getElementById('pinerr');
  err.textContent = 'Проверяю…';
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.ok) { err.textContent = (r && r.error) || 'Ошибка'; return; }
      err.textContent = '';
      TOKEN = r.data.token;
      try { localStorage.setItem('adm_token', TOKEN); } catch (e) {}
      start();
    })
    .withFailureHandler(function (e) { err.textContent = String(e.message || e); })
    .adminApi('login', { pin: pin }, '');
}

document.getElementById('pin').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doLogin();
});

function start() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  HIST = [];
  armBack();
  tabGo('today');
}

// ================= НАВИГАЦИЯ =================
// Системная кнопка "назад" на телефоне не должна закрывать приложение:
// держим в истории браузера запасной шаг и перехватываем popstate.
function armBack() {
  try {
    history.replaceState({ adm: 0 }, '');
    history.pushState({ adm: 1 }, '');
    window.addEventListener('popstate', function () {
      history.pushState({ adm: 1 }, '');
      goBack();
    });
  } catch (e) {}
}

function snap() { return { screen: S.screen, dir: S.dir, store: S.store, q: S.q }; }

function go(screen, opts) {
  HIST.push(snap());
  if (HIST.length > 20) HIST.shift();
  apply(screen, opts);
}

function tabGo(screen) {          // переход по нижним вкладкам обнуляет историю
  HIST = [];
  apply(screen, {});
}

function apply(screen, opts) {
  opts = opts || {};
  S.screen = screen;
  if (opts.dir !== undefined) S.dir = opts.dir;
  if (opts.store !== undefined) S.store = opts.store;
  if (opts.q !== undefined) S.q = opts.q;
  tabs(screen);
  load();
}

function goBack() {
  var prev = HIST.pop();
  if (!prev) { if (S.screen !== 'today') apply('today', {}); return; }
  S.dir = prev.dir; S.store = prev.store; S.q = prev.q;
  S.screen = prev.screen;
  tabs(prev.screen);
  load();
}

function load() {
  if (S.screen === 'today') return loadToday();
  if (S.screen === 'dir') return loadDir(S.dir);
  if (S.screen === 'stores') return loadStores(S.q);
  if (S.screen === 'store') return loadStore(S.store, S.dir);
  if (S.screen === 'restore') return loadRestore(S.dir || 'bakery');
  if (S.screen === 'dups') return loadDups(S.dir === 'veg' ? 'veg' : 'bakery');
  if (S.screen === 'schedule') return loadSchedule(S.dir || '');
  if (S.screen === 'log') return loadLog();
  if (S.screen === 'health') return loadHealth();
  if (S.screen === 'edit') return loadEdit(S.store, S.dir);
  if (S.screen === 'card') return loadCard(S.store);
  if (S.screen === 'wo') return loadWo();
  if (S.screen === 'wostore') return loadWoStore(S.store);
}

// ================= ОБЩЕЕ =================
function setHead(title, sub) {
  document.getElementById('title').textContent = title;
  document.getElementById('subtitle').textContent = sub || '';
  document.getElementById('back').style.display = HIST.length ? 'flex' : 'none';
}

function tabs(name) {
  var map = { today: 'today', dir: 'today', schedule: 'today', dups: 'today',
              stores: 'stores', store: 'stores', restore: 'restore', log: 'log',
              health: 'today', edit: 'stores', card: 'stores', wo: 'today', wostore: 'today' };
  var on = map[name] || 'today';
  ['today', 'stores', 'restore', 'log'].forEach(function (k) {
    var el = document.getElementById('t-' + k);
    if (el) el.className = 'tab' + (k === on ? ' on' : '');
  });
}

function view(html) { document.getElementById('view').innerHTML = html; }
function spin(t) { view('<div class="spin">' + esc(t || 'Загрузка…') + '</div>'); }
function fail(e) { view('<div class="bad">' + esc(e && e.message ? e.message : e) + '</div>'); }

function section(title, inner) {
  return '<div>' + (title ? '<div class="sec">' + esc(title) + '</div>' : '') + inner + '</div>';
}

// значок ЮА маркет (колонка T Довідника), як у продавців
var UA_TAG = '<span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;' +
  'background:#1565C0;color:#fff;font-size:11px;font-weight:700;vertical-align:2px">ЮА</span>';
function item(title, sub, right, onclick, ua) {
  var tag = onclick ? 'button' : 'div';
  return '<' + tag + ' class="item"' + (onclick ? ' onclick="' + onclick + '"' : '') + '>' +
    '<span class="grow"><span class="t">' + esc(title) + (ua ? UA_TAG : '') + '</span>' +
    (sub ? '<span class="s">' + sub + '</span>' : '') + '</span>' +
    (right ? '<span class="right">' + right + '</span>' : '') +
    (onclick ? CHEV : '') + '</' + tag + '>';
}
</script>
<script>
// ================= СЕГОДНЯ =================
function loadToday() {
  setHead('Сегодня', '');
  spin();
  call('today').then(function (d) {
    S.today = d.today;
    setHead('Сегодня', d.today + ', ' + d.time);

    var h = '';
    var alerts = d.dirs.filter(function (x) {
      return !x.closed && x.minLeft !== null && x.minLeft > 0 && x.minLeft <= 60 && x.waiting.length;
    });
    if (alerts.length) {
      h += '<div class="note">' + alerts.map(function (x) {
        return 'До дедлайна «' + esc(DIRS[x.key].t) + '» ' + x.minLeft +
               ' мин. Не заказали ' + x.waiting.length + ' точек.';
      }).join('<br><br>') + '</div>';
    }

    var cards = '';
    ORDER.forEach(function (k) {
      var x = null;
      d.dirs.forEach(function (y) { if (y.key === k) x = y; });
      if (!x) return;
      var m = DIRS[k];
      var pill = !x.enabled ? '<span class="pill closed">Выключено</span>'
               : x.noDayToday ? '<span class="pill off">Сегодня не приём</span>'
               : (x.openedAll ? '<span class="pill warn">Открыто всем</span>'
               : (x.closed ? '<span class="pill closed">Закрыто</span>'
                           : '<span class="pill open">Открыто</span>'));
      var pct = x.total ? Math.round(x.ordered / x.total * 100) : 0;
      cards += '<button class="dir" onclick="go(\'dir\',{dir:\'' + k + '\'})">' +
        '<span class="dirtop">' +
          '<span class="sq" style="background:' + m.c + '">' + m.s + '</span>' +
          '<span class="grow"><span class="t" style="font-size:17px;font-weight:700;display:block">' +
            esc(m.t) + '</span>' +
            '<span class="s" style="display:block">до ' + esc(x.deadline || '—') +
            (x.reportAt ? ' · отчёт в ' + esc(x.reportAt) : '') +
            (x.byDays && x.offDay ? ' · вне графика ' + x.offDay : '') + '</span></span>' +
          pill + '</span>' +
        (x.noDayToday
          ? '<span class="s" style="margin-top:14px">Сегодня (' + esc(d.dow) + ') по графику ' +
            'не заказывает ни одна из ' + x.all + ' точек</span>'
          : '<span style="display:flex;align-items:center;gap:12px;margin-top:16px">' +
            '<span class="bar"><i style="width:' + pct + '%;background:' + m.c + '"></i></span>' +
            '<span style="font-size:14px;font-weight:700;white-space:nowrap">' +
              x.ordered + ' из ' + x.total + '</span></span>') +
        '</button>';
    });
    var stale = d.dirs.filter(function (x) { return x.enabled && x.ordered > 0 && !x.reportAt; });
    if (stale.length) h += '<button class="bad" style="display:block;width:100%;text-align:left;cursor:pointer" ' +
      'onclick="go(\'health\',{})">Заказы есть, а отчёт сегодня не собирался: ' +
      stale.map(function (x) { return esc(DIRS[x.key] ? DIRS[x.key].short : x.key); }).join(', ') +
      '. Нажмите, чтобы проверить.</button>';
    h += section('Направления', cards);
    h += woBriefSlot();                       // списания - отдельным пунктом (WriteOffAdminJs)

    h += section('Быстрые действия', '<div class="card">' +
      item('График по точкам', 'кому какие дни и что доступно сегодня', '', 'go(\'schedule\',{dir:\'\'})') +
      item('Заказы точки', 'посмотреть, отменить, снять метку', '', 'tabGo(\'stores\')') +
      item('Восстановить из бэкапа', 'вернуть строки, которых нет в листе', '', 'tabGo(\'restore\')') +
      item('Убрать дубли', 'найти и удалить задвоенные строки заказов', '', 'go(\'dups\',{dir:\'bakery\'})') +
      item('Здоровье системы', 'отчёты, триггеры, ошибки', '', 'go(\'health\',{})') +
      item('Журнал действий', 'что и когда нажимали', '', 'tabGo(\'log\')') +
      '</div>');

    view(h);
    woBriefFill();
  }).catch(fail);
}

// ================= НАПРАВЛЕНИЕ =================
function loadDir(k) {
  var m = DIRS[k];
  setHead(m.t, '');
  spin();
  Promise.all([call('today'), call('dirStores', { dir: k })]).then(function (r) {
    var d = r[0], ds = r[1];
    var x = null;
    d.dirs.forEach(function (y) { if (y.key === k) x = y; });
    if (!x) return fail(new Error('Направление не найдено'));

    var byDay = ds.done.length + ds.wait.length;
    var h = '<div class="info">' +
      'Дедлайн <b>' + esc(x.deadline || '—') + '</b>, сейчас ' + esc(d.time) + '.<br>' +
      (ds.byDays
        ? 'Сегодня ' + esc(ds.dow) + ' — по графику заказывают <b>' + byDay + '</b> точек из <b>' +
          (byDay + ds.off.length) + '</b>.<br>'
        : '') +
      'Заказали <b>' + ds.done.length + '</b> из <b>' + byDay + '</b>' +
      (x.reportAt ? ', отчёт собран в ' + esc(x.reportAt) : '') + '.' +
      (x.openedAll ? '<br>Приём открыт всем до конца дня.' : '') +
      (!x.enabled ? '<br><b style="color:#b3261e">Направление выключено — продавцы его не видят в меню.</b>' : '') +
      '</div>';

    h += section('Управление приёмом', '<div class="card">' +
      (x.enabled
        ? item('Выключить направление', 'исчезнет из меню продавцов до включения обратно',
               '', 'askDisableDir(\'' + k + '\')')
        : item('Включить направление', 'снова появится в меню продавцов', '', 'askEnableDir(\'' + k + '\')')) +
      (x.openedAll
        ? item('Вернуть обычный режим', 'дедлайн снова действует', '', 'askCloseAll(\'' + k + '\')')
        : item('Открыть приём всем до конца дня', 'дедлайн ' + esc(x.deadline || '—') + ' сегодня не действует',
               '', 'askOpenAll(\'' + k + '\')')) +
      item('Проверить бэкап', 'сравнить с рабочим листом', '', 'go(\'restore\',{dir:\'' + k + '\'})') +
      ((k === 'bakery' || k === 'veg')
        ? item('Убрать дубли', 'задвоенные строки в рабочем листе', '', 'go(\'dups\',{dir:\'' + k + '\'})') : '') +
      '</div>');

    var files = item('Собрать отчёт сейчас', 'не дожидаясь пятиминутного триггера', '',
                     'askReport(\'' + k + '\')');
    if (ds.xlsx) files += '<a class="item" href="' + attr(ds.xlsx) + '" target="_blank" rel="noopener" ' +
      'style="text-decoration:none;color:inherit"><span class="grow"><span class="t">Скачать Excel</span>' +
      '<span class="s">только лист отчёта, без остальных листов</span></span>' + CHEV + '</a>';
    if (ds.sheetUrl) files += '<a class="item" href="' + attr(ds.sheetUrl) + '" target="_blank" rel="noopener" ' +
      'style="text-decoration:none;color:inherit"><span class="grow"><span class="t">Открыть таблицу</span>' +
      '<span class="s">в Google Таблицах</span></span>' + CHEV + '</a>';
    h += section('Отчёты и файлы', '<div class="card">' + files + '</div>');

    if (ds.done.length) {
      h += section('Заказали (' + ds.done.length + ')', '<div class="card">' +
        ds.done.map(function (s) {
          var sub = s.n + ' позиций · ' + s.qty + ' ' + esc(ds.unit) +
                    (s.time ? ' · в ' + esc(s.time) : '') +
                    (s.code ? ' · № ' + esc(s.code) : '');
          return item(s.label, sub, '', 'go(\'store\',{store:\'' + attr(s.id) + '\',dir:\'' + k + '\'})', s.ua);
        }).join('') + '</div>');
    }

    if (ds.wait.length) {
      h += section('Ещё не заказали (' + ds.wait.length + ')', '<div class="card">' +
        ds.wait.map(function (s) {
          var sub = (s.code ? '№ ' + esc(s.code) : '') + (s.route ? ' · маршрут ' + esc(s.route) : '');
          return item(s.label, sub, '', 'go(\'store\',{store:\'' + attr(s.id) + '\',dir:\'' + k + '\'})', s.ua);
        }).join('') + '</div>');
    } else if (byDay) {
      h += '<div class="ok">Заказали все точки, у которых сегодня приём.</div>';
    }

    if (ds.off.length) {
      h += section('Сегодня не их день (' + ds.off.length + ')', '<div class="card">' +
        ds.off.map(function (s) {
          var sub = 'дни приёма: ' + esc(s.days || '—') + (s.next ? ' · ближайший ' + esc(s.next) : '');
          return item(s.label, sub, '', 'go(\'store\',{store:\'' + attr(s.id) + '\',dir:\'' + k + '\'})', s.ua);
        }).join('') + '</div>');
    }

    view(h);
  }).catch(fail);
}

// ================= ГРАФИК ПО ТОЧКАМ =================
function loadSchedule(dir) {
  S.dir = dir;
  setHead('График', 'кому что доступно сегодня');
  var chips = '<div class="chips"><button class="chip' + (dir ? '' : ' on') +
    '" onclick="apply(\'schedule\',{dir:\'\'})">Все</button>' +
    ORDER.map(function (k) {
      return '<button class="chip' + (k === dir ? ' on' : '') + '" onclick="apply(\'schedule\',{dir:\'' +
        k + '\'})">' + esc(DIRS[k].short) + '</button>';
    }).join('') + '</div>';
  view(chips + '<div id="sch"><div class="spin">Загрузка…</div></div>');

  call('schedule', { dir: dir }).then(function (d) {
    var el = document.getElementById('sch');
    if (!el) return;

    var h = '<div class="info">Сегодня ' + esc(d.dow) + ', ' + esc(d.today) + '.<br>' +
      'Зелёным — направление, по которому точка может заказать сегодня.</div>';

    h += '<div style="margin-top:22px"><div class="sec">Точки (' + d.rows.length + ')</div><div class="card">' +
      d.rows.map(function (r) {
        var lines = r.cells.map(function (c) {
          var color = c.today ? '#166B3A' : '#7A828E';
          var mark = c.today ? (c.ordered ? 'заказали' : 'можно до ' + esc(c.deadline || '—'))
                             : ('не сегодня · дни: ' + esc(c.days || '—') +
                                (c.next ? ' · ' + esc(c.next) : ''));
          return '<div style="display:flex;gap:10px;font-size:13.5px;line-height:1.5;color:' + color + '">' +
            '<span style="flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:' +
            (DIRS[c.dir] ? DIRS[c.dir].c : '#ccc') + ';opacity:' + (c.today ? '1' : '.35') + '"></span>' +
            '<span class="grow"><b style="font-weight:600">' + esc(DIRS[c.dir] ? DIRS[c.dir].short : c.dir) +
            '</b> — ' + mark + '</span></div>';
        }).join('');
        return '<button class="item" style="align-items:flex-start" onclick="go(\'store\',{store:\'' +
          attr(r.id) + '\',dir:\'\'})"><span class="grow"><span class="t">' + esc(r.label) + (r.ua ? UA_TAG : '') + '</span>' +
          '<span style="display:block;margin-top:8px">' + lines + '</span></span>' + CHEV + '</button>';
      }).join('') + '</div></div>';

    el.innerHTML = h;
  }).catch(fail);
}
</script>
<script>
// ================= ТОЧКИ =================
function loadStores(q) {
  setHead('Точки', 'поиск по адресу или номеру');
  view('<div><input id="q" type="search" placeholder="Например: Валентиновская или 14" value="' +
       esc(q || '') + '"></div><div id="list"><div class="spin">Загрузка…</div></div>');
  var inp = document.getElementById('q');
  inp.addEventListener('input', function () {
    clearTimeout(S.t);
    S.q = inp.value;
    S.t = setTimeout(function () { fillStores(inp.value); }, 300);
  });
  fillStores(q || '');
}

function fillStores(q) {
  call('stores', { q: q, dir: '' }).then(function (list) {
    var el = document.getElementById('list');
    if (!el) return;
    if (!list.length) { el.innerHTML = '<div class="note">Ничего не найдено</div>'; return; }
    el.innerHTML = '<div class="card">' + list.map(function (s) {
      var dots = s.directions.map(function (k) {
        return '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;' +
               'background:' + (DIRS[k] ? DIRS[k].c : '#ccc') + ';margin-right:5px"></span>';
      }).join('');
      var sub = dots + (s.code ? '№ ' + esc(s.code) : '') + (s.route ? ' · маршрут ' + esc(s.route) : '');
      return item(s.label, sub, '', 'go(\'store\',{store:\'' + attr(s.id) + '\',dir:\'\'})', s.ua);
    }).join('') + '</div>';
  }).catch(fail);
}

function loadStore(id, dir) {
  setHead('Точка', '');
  spin();
  call('store', { storeId: id, dir: dir || '' }).then(function (d) {
    S.dir = d.dir;
    setHead(d.label + (d.ua ? ' · ЮА' : ''), (d.code ? '№ ' + d.code : '') + (d.route ? ' · маршрут ' + d.route : ''));

    var sched = {};
    (d.schedule || []).forEach(function (c) { sched[c.dir] = c; });

    var h = '<div class="chips">' + d.directions.map(function (k) {
      var c = sched[k] || { today: true };
      return '<button class="chip' + (k === d.dir ? ' on' : '') + '" style="' +
        (c.today ? '' : 'opacity:.5') + '" onclick="apply(\'store\',{store:\'' +
        attr(d.id) + '\',dir:\'' + k + '\'})">' + esc(DIRS[k] ? DIRS[k].short : k) +
        (c.today ? '' : ' ✕') + '</button>';
    }).join('') + '</div>';

    var me = sched[d.dir];
    if (!d.dayOk) h += '<div class="note">Сегодня не день приёма по этому направлению.' +
      (me && me.days ? ' Дни точки: ' + esc(me.days) + '.' : '') +
      (me && me.next ? ' Ближайший приём ' + esc(me.next) + '.' : '') + '</div>';
    if (d.lateLeft) h += '<div class="ok">Приём открыт ещё ' + d.lateLeft + ' мин.</div>';

    if (d.schedule && d.schedule.length) {
      h += section('График точки', '<div class="card">' + d.schedule.map(function (c) {
        var right = c.today
          ? '<span style="color:#166B3A;font-weight:600">сегодня можно</span>'
          : '<span style="color:#7A828E;font-weight:500">' + esc(c.next || 'не сегодня') + '</span>';
        return '<div class="item"><span class="grow"><span class="t">' +
          esc(DIRS[c.dir] ? DIRS[c.dir].t : c.title) + '</span><span class="s">дни: ' +
          esc(c.days || '—') + ' · дедлайн ' + esc(c.deadline || '—') + '</span></span>' +
          '<span class="right" style="font-size:13.5px">' + right + '</span></div>';
      }).join('') + '</div>');
    }

    if (d.rows.length) {
      var rows = d.rows.map(function (r) {
        return '<div class="item" style="min-height:52px;padding:13px 16px">' +
          '<span class="grow"><span style="font-size:15px">' + esc(r.name) + '</span></span>' +
          '<span class="right">' + r.qty + '</span></div>';
      }).join('');
      h += section('Заказ на ' + esc(S.today || d.today || ''), '<div class="card">' + rows +
        '<div class="item" style="background:#FAFBFC;min-height:52px">' +
        '<span class="grow"><span class="s" style="margin:0">' + d.rows.length + ' позиций · ' +
        d.qty + ' ' + esc(d.unit) + ' · лист «' + esc(d.sheet) + '»' +
        (d.firstRow ? ', с ' + d.firstRow + '-й строки' : '') + '</span></span></div></div>');
    } else {
      h += section('Заказ на ' + esc(S.today || ''), '<div class="info">Сегодня заказа нет.' +
        (d.marked ? '<br><b>Но метка «уже заказывали» стоит</b> — значит строки потерялись. ' +
                    'Снимите метку или проверьте бэкап.' : '') + '</div>');
    }

    var acts = '';
    if (d.rows.length) acts += item('Отменить заказ', 'убрать строки и метку — точка закажет заново',
      '', 'askCancel(\'' + attr(d.id) + '\',\'' + d.dir + '\',' + d.rows.length + ')');
    if (d.marked) acts += item('Снять метку «уже заказывали»', 'строки остаются на месте',
      '', 'askClearMark(\'' + attr(d.id) + '\',\'' + d.dir + '\')');
    if (d.rows.length) acts += item('Изменить заказ', 'поправить количество или убрать позиции',
      '', 'go(\'edit\',{store:\'' + attr(d.id) + '\',dir:\'' + d.dir + '\'})');
    if (d.directions.indexOf('bakery') >= 0)
      acts += item('Списания точки', 'выпечка и кулинария: что и на сколько списали',
        '', 'go(\'wostore\',{store:\'' + attr(d.id) + '\'})');
    acts += item('Карточка точки', 'направления, дни, зона, ЄДРПОУ, номер',
      '', 'go(\'card\',{store:\'' + attr(d.id) + '\',dir:\'' + d.dir + '\'})');
    acts += item('Открыть приём этой точке', 'на 30 минут, даже после дедлайна',
      '', 'askOpenStore(\'' + attr(d.id) + '\',\'' + d.dir + '\')');
    acts += item('Проверить бэкап направления', 'что потерялось из рабочего листа',
      '', 'go(\'restore\',{dir:\'' + d.dir + '\'})');
    h += section('Действия', '<div class="card">' + acts + '</div>');

    view(h);
  }).catch(fail);
}
</script>
<script>
// ================= ПОДТВЕРЖДЕНИЕ =================
function confirmSheet(o) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">' +
    '<div class="grip"></div><h2>' + esc(o.title) + '</h2>' +
    '<div class="sub">' + esc(o.sub || '') + '</div>' +
    '<div class="what">' + o.what.map(function (t) {
      return '<div><span style="flex:none;color:#7A828E">—</span><span>' + esc(t) + '</span></div>';
    }).join('') + '</div>' +
    '<button class="btn" id="yes">' + esc(o.yes || 'Подтвердить') + '</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Отмена</button></div></div>';

  document.getElementById('yes').onclick = function () {
    var b = this;
    if (S.busy) return;
    S.busy = true; b.disabled = true; b.textContent = 'Выполняю…';
    o.run().then(function (res) {
      S.busy = false; closeSheet();
      if (o.done) o.done(res);
    }).catch(function (e) {
      S.busy = false; b.disabled = false; b.textContent = o.yes || 'Подтвердить';
      toast(e && e.message ? e.message : String(e));
    });
  };
}

function closeSheet() { document.getElementById('modal').innerHTML = ''; }

function toast(text) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div style="position:fixed;left:16px;right:16px;bottom:104px;z-index:60;background:#16181D;' +
    'color:#fff;border-radius:16px;padding:16px;font-size:15px;text-align:center;max-width:528px;margin:0 auto">' +
    esc(text) + '</div>';
  setTimeout(function () { if (m.firstChild && !m.querySelector('.mask')) m.innerHTML = ''; }, 3000);
}

function askCancel(id, dir, n) {
  confirmSheet({
    title: 'Отменить заказ?', sub: DIRS[dir].t,
    what: ['Из рабочего листа удалятся ' + n + ' строк сегодняшнего заказа',
           'Снимется метка «уже заказывали» — точка сможет заказать заново',
           'Действие попадёт в журнал'],
    yes: 'Да, отменить',
    run: function () { return call('cancelOrder', { storeId: id, dir: dir }); },
    done: function (r) { toast('Удалено строк: ' + r.removed); apply('store', { store: id, dir: dir }); }
  });
}

function askClearMark(id, dir) {
  confirmSheet({
    title: 'Снять метку?', sub: DIRS[dir].t,
    what: ['Строки в листе остаются как есть',
           'Точка сможет отправить заказ ещё раз',
           'Действие попадёт в журнал'],
    yes: 'Снять метку',
    run: function () { return call('clearMark', { storeId: id, dir: dir }); },
    done: function () { toast('Метка снята'); apply('store', { store: id, dir: dir }); }
  });
}

function askOpenStore(id, dir) {
  confirmSheet({
    title: 'Открыть приём точке?', sub: DIRS[dir].t,
    what: ['Точка сможет отправить заказ ближайшие 30 минут',
           'На остальные точки это не влияет',
           'Метку «уже заказывали» не трогаем — дубля не будет'],
    yes: 'Открыть на 30 минут',
    run: function () { return call('openStore', { storeId: id, dir: dir }); },
    done: function (r) { toast('Открыто на ' + (r.left || 30) + ' мин'); apply('store', { store: id, dir: dir }); }
  });
}

function askOpenAll(dir) {
  confirmSheet({
    title: 'Открыть всем до конца дня?', sub: DIRS[dir].t,
    what: ['Дедлайн сегодня не действует ни для одной точки',
           'Кто уже заказал — останется заблокирован, дублей не будет',
           'Вернуть обычный режим можно этой же кнопкой'],
    yes: 'Открыть всем',
    run: function () { return call('openAll', { dir: dir }); },
    done: function () { toast('Открыто до конца дня'); apply('dir', { dir: dir }); }
  });
}

function askReport(dir) {
  confirmSheet({
    title: 'Собрать отчёт сейчас?', sub: DIRS[dir].t,
    what: ['Листы отчёта пересоберутся по текущим строкам сырого листа',
           'Сырой лист не меняется',
           'Занимает несколько секунд'],
    yes: 'Собрать',
    run: function () { return call('report', { dir: dir }); },
    done: function (r) { toast('Отчёт собран' + (r.at ? ' в ' + r.at : '')); apply('dir', { dir: dir }); }
  });
}

function askCloseAll(dir) {
  confirmSheet({
    title: 'Вернуть обычный режим?', sub: DIRS[dir].t,
    what: ['Дедлайн снова действует', 'Принятые заказы остаются на месте'],
    yes: 'Вернуть',
    run: function () { return call('closeAll', { dir: dir }); },
    done: function () { toast('Обычный режим'); apply('dir', { dir: dir }); }
  });
}

function askDisableDir(dir) {
  confirmSheet({
    title: 'Выключить направление?', sub: DIRS[dir].t,
    what: ['Исчезнет из меню на телефонах продавцов — ни точка, ни карточка',
           'Уже принятые сегодня заказы и отчёты не трогает',
           'Новые заказы по этому направлению принимать перестанет',
           'Включить обратно можно этой же кнопкой в любой момент'],
    yes: 'Выключить',
    run: function () { return call('setDirEnabled', { dir: dir, on: false }); },
    done: function () { toast('Направление выключено'); apply('dir', { dir: dir }); }
  });
}

function askEnableDir(dir) {
  confirmSheet({
    title: 'Включить направление?', sub: DIRS[dir].t,
    what: ['Снова появится в меню продавцов', 'Дедлайн и график дней — как обычно'],
    yes: 'Включить',
    run: function () { return call('setDirEnabled', { dir: dir, on: true }); },
    done: function () { toast('Направление включено'); apply('dir', { dir: dir }); }
  });
}
</script>
<script>
// ================= БЭКАП =================
function loadRestore(dir) {
  S.dir = dir;
  setHead('Бэкап', 'сравнение с рабочим листом');
  var chips = '<div class="chips">' + ORDER.map(function (k) {
    return '<button class="chip' + (k === dir ? ' on' : '') + '" onclick="apply(\'restore\',{dir:\'' +
      k + '\'})">' + esc(DIRS[k].short) + '</button>';
  }).join('') + '</div>';
  view(chips + '<div id="res"><div class="spin">Сравниваю бэкап с рабочим листом…</div></div>');

  call('restoreScan', { dir: dir }).then(function (d) {
    var el = document.getElementById('res');
    if (!el) return;
    S.scan = d;

    var h = '<div class="info">' + esc(d.dirTitle) + ', ' + esc(d.date) + '<br>' +
      'В бэкапе <b>' + d.backupRows + '</b> строк, в рабочем листе <b>' + d.liveRows + '</b>.</div>';

    if (!d.stores.length) {
      el.innerHTML = h + '<div class="ok" style="margin-top:20px">Всё на месте — пропавших строк нет.</div>';
      return;
    }

    h += '<div class="bad" style="margin-top:20px">Не хватает <b>' + d.missingRows + '</b> строк от ' +
         d.stores.length + ' точек. Отметьте, что вернуть.</div>';

    h += '<div style="margin-top:22px">' + '<div class="sec">Что вернуть</div><div class="card">' +
      d.stores.map(function (s, i) {
        return '<label class="pick"><input type="checkbox" checked data-key="' + attr(s.key) + '">' +
          '<span class="grow"><span class="t">' + esc(s.label) + '</span>' +
          '<span class="s">' + s.missing + ' строк · ' + s.qty + ' ' + esc(d.unit) +
          ' · снимок ' + esc(s.stamp) + '</span></span>' +
          '<span class="right" style="color:#E11B22;font-size:13.5px" ' +
          'onclick="event.preventDefault();event.stopPropagation();toggleItems(' + i + ')">что именно</span>' +
          '</label>' +
          '<div id="it' + i + '" style="display:none;padding:4px 16px 14px 54px;background:#FAFBFC">' +
          s.items.map(function (it) {
            return '<div style="display:flex;gap:12px;font-size:14.5px;padding:5px 0">' +
              '<span class="grow">' + esc(it.name) + '</span>' +
              '<span style="font-weight:600">' + it.qty + '</span></div>';
          }).join('') + '</div>';
      }).join('') + '</div></div>';

    h += '<div style="margin-top:22px"><div class="sec">Как это работает</div><div class="info">' +
      'Строки только дописываются в конец листа — ничего не стирается и не перезаписывается.<br><br>' +
      'Дубли отсеиваются: то, что уже есть в листе, повторно не ляжет.<br><br>' +
      'После возврата отчёт и выгрузка пересобираются сами.</div></div>';

    h += '<div style="margin-top:22px"><button class="btn" onclick="askRestore()">' +
         'Вернуть отмеченные строки</button></div>';
    el.innerHTML = h;
  }).catch(fail);
}

function toggleItems(i) {
  var el = document.getElementById('it' + i);
  if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}

function askRestore() {
  var keys = [];
  Array.prototype.forEach.call(document.querySelectorAll('input[data-key]'), function (c) {
    if (c.checked) keys.push(c.getAttribute('data-key'));
  });
  if (!keys.length) return toast('Ничего не отмечено');

  var d = S.scan, n = 0, names = [];
  d.stores.forEach(function (s) {
    if (keys.indexOf(s.key) < 0) return;
    n += s.missing; names.push(s.label);
  });

  confirmSheet({
    title: 'Вернуть ' + n + ' строк?',
    sub: d.dirTitle + ', ' + d.date + ' · ' + names.join(', '),
    what: ['Добавится ' + n + ' строк в конец листа «' + d.sheet + '»',
           'Ничего не удаляется и не перезаписывается',
           'Дубли отсеиваются автоматически',
           'Действие попадёт в журнал'],
    yes: 'Да, вернуть',
    run: function () { return call('restoreApply', { dir: d.dir, date: d.date, keys: keys }); },
    done: function (r) { toast('Возвращено строк: ' + r.added); apply('restore', { dir: d.dir }); }
  });
}

// ================= ДУБЛИ =================
function loadDups(dir) {
  S.dir = dir;
  setHead('Дубли', 'задвоенные строки в рабочем листе');
  var chips = '<div class="chips">' + ['bakery', 'veg'].map(function (k) {
    return '<button class="chip' + (k === dir ? ' on' : '') + '" onclick="apply(\'dups\',{dir:\'' +
      k + '\'})">' + esc(DIRS[k].short) + '</button>';
  }).join('') + '</div>';
  view(chips + '<div id="res"><div class="spin">Ищу дубли в листе…</div></div>');

  call('dupScan', { dir: dir }).then(function (d) {
    var el = document.getElementById('res');
    if (!el) return;
    S.dup = d;

    var h = '<div class="info">' + esc(d.dirTitle) + '<br>Строк в листе: <b>' + d.liveRows + '</b>.<br><br>' +
      'Дубль — строка с тем же временем, адресом, товаром и количеством. ' +
      'В одном заказе товар не может стоять дважды.</div>';

    if (!d.orders.length) {
      el.innerHTML = h + '<div class="ok" style="margin-top:20px">Дублей нет.</div>';
      return;
    }

    h += '<div class="bad" style="margin-top:20px">Лишних строк: <b>' + d.extraTotal + '</b>, заказов: ' +
         d.orders.length + '. Отметьте, где убрать.</div>';

    h += '<div style="margin-top:22px"><div class="sec">Где убрать</div><div class="card">' +
      d.orders.map(function (o, i) {
        return '<label class="pick"><input type="checkbox" checked data-i="' + i + '">' +
          '<span class="grow"><span class="t">' + esc(o.addr) + '</span>' +
          '<span class="s">' + esc(o.date) + ' ' + esc(o.time) + ' · лишних строк ' + o.extra +
          ' из ' + o.total + '</span></span>' +
          '<span class="right" style="color:#E11B22;font-size:13.5px" ' +
          'onclick="event.preventDefault();event.stopPropagation();toggleItems(' + i + ')">что именно</span>' +
          '</label>' +
          '<div id="it' + i + '" style="display:none;padding:4px 16px 14px 54px;background:#FAFBFC">' +
          o.positions.map(function (p) {
            return '<div style="display:flex;gap:12px;font-size:14.5px;padding:5px 0">' +
              '<span class="grow">' + esc(p.name) + '</span>' +
              '<span style="font-weight:600">' + p.qty + ' × ' + p.n + '</span></div>';
          }).join('') + '</div>';
      }).join('') + '</div></div>';

    h += '<div style="margin-top:22px"><div class="sec">Как это работает</div><div class="info">' +
      'В каждой группе одинаковых строк остаётся <b>одна</b>, остальные удаляются.<br><br>' +
      'Другие заказы и другие товары не затрагиваются.<br><br>' +
      'Каждое удаление попадает в журнал вместе со списком товаров. ' +
      'Отчёт пересоберётся сам в течение 5 минут или кнопкой «Собрать отчёт».</div></div>';

    h += '<div style="margin-top:22px"><button class="btn" onclick="askDups()">Убрать дубли в отмеченных</button></div>';
    el.innerHTML = h;
  }).catch(fail);
}

function askDups() {
  var d = S.dup, keys = [], n = 0, names = [];
  Array.prototype.forEach.call(document.querySelectorAll('input[data-i]'), function (c) {
    if (!c.checked) return;
    var o = d.orders[Number(c.getAttribute('data-i'))];
    if (!o) return;
    keys.push(o.key); n += o.extra; names.push(o.addr + ' (' + o.date + ' ' + o.time + ')');
  });
  if (!keys.length) return toast('Ничего не отмечено');

  confirmSheet({
    title: 'Удалить ' + n + ' лишних строк?',
    sub: d.dirTitle + ' · ' + names.join(', '),
    what: ['Из листа «' + d.sheet + '» удалится ' + n + ' повторных строк',
           'В каждой группе одинаковых строк остаётся одна',
           'Отменить нельзя, но что удалено, видно в журнале',
           'Действие попадёт в журнал'],
    yes: 'Да, удалить',
    run: function () { return call('dupApply', { dir: d.dir, keys: keys }); },
    done: function (r) { toast('Удалено строк: ' + r.removed); apply('dups', { dir: d.dir }); }
  });
}

// ================= ЖУРНАЛ =================
function loadLog() {
  setHead('Журнал', 'последние действия');
  spin();
  call('log').then(function (list) {
    var out = '<div class="card">' + list.map(function (r) {
      return '<div class="item"><span class="grow"><span class="t">' + esc(r.what) + '</span>' +
        '<span class="s">' + esc(r.details) + '</span></span>' +
        '<span class="right" style="font-size:12.5px;color:#7A828E;font-weight:500">' +
        esc(r.when).replace(' ', '<br>') + '</span></div>';
    }).join('') + '</div>';
    if (!list.length) out = '<div class="info">Пока пусто. Здесь появится всё, что меняли через пульт.</div>';
    view(out + '<div><button class="btn ghost" onclick="logout()">Выйти из пульта</button></div>');
  }).catch(fail);
}

if (TOKEN) start();
</script>

<script>
// ================= ЗДОРОВЬЕ СИСТЕМЫ =================
var HC = { ok: '#2E9E5B', warn: '#E0A100', bad: '#D93025', off: '#B7BCC4' };

function hList(arr) {
  return '<div class="card">' + arr.map(function (x) {
    return '<div class="item" style="align-items:flex-start">' +
      '<span style="flex:none;width:12px;height:12px;border-radius:50%;margin-top:5px;background:' +
      (HC[x.lv] || HC.off) + '"></span><span class="grow"><span class="t">' + esc(x.t) + '</span>' +
      (x.s ? '<span class="s">' + esc(x.s) + '</span>' : '') + '</span></div>';
  }).join('') + '</div>';
}

function loadHealth() {
  setHead('Здоровье системы', '');
  spin('Проверяю…');
  call('health').then(function (d) {
    setHead('Здоровье системы', 'проверено в ' + d.time);
    var cls = d.level === 'ok' ? 'ok' : (d.level === 'bad' ? 'bad' : 'note');
    var h = '<div class="' + cls + '">' + esc(d.summary) + '</div>';
    h += section('Отчёты по направлениям', hList(d.dirs.map(function (x) {
      return { t: DIRS[x.key] ? DIRS[x.key].t : x.title, s: x.text, lv: x.level };
    })));
    h += section('Триггеры', d.triggers.length ? hList(d.triggers.map(function (x) {
      return { t: x.name, s: x.text, lv: x.level };
    })) : '<div class="bad">Триггеров нет совсем — запустите d06_installTriggers() в редакторе.</div>');
    h += section('Ошибки пульта', d.errors.length
      ? hList(d.errors.map(function (e) {
          return { t: e.where, s: e.at + ' · ' + e.msg, lv: e.today ? 'warn' : 'off' };
        })) + '<div style="margin-top:12px"><button class="btn ghost" onclick="askHealthClear()">Очистить список</button></div>'
      : '<div class="info">Ошибок не было.</div>');
    if (PERF.length) h += section('Скорость пульта (этот телефон, последние запросы)', hList(PERF.map(function (p) {
      return { t: p.a + ' — ' + p.total + ' мс',
               s: p.at + (p.srv != null ? ' · сервер ' + p.srv + ' мс · связь и запуск ' + (p.total - p.srv) + ' мс' : ' · ошибка связи'),
               lv: p.total > 4000 ? 'bad' : (p.total > 2000 ? 'warn' : 'ok') };
    })));
    var s = d.sys;
    h += section('Система', hList([
      { t: 'Версия', s: s.version, lv: 'off' },
      { t: 'Тестовый режим', s: s.test ? 'ВКЛЮЧЁН — заказы уходят в тестовые листы' : 'выключен', lv: s.test ? 'bad' : 'ok' },
      { t: 'Свойства скрипта', s: s.keys + ' ключей · примерно ' + s.pct + '% лимита',
        lv: s.pct >= 90 ? 'bad' : (s.pct >= 70 ? 'warn' : 'ok') },
      { t: 'Сессии пульта', s: String(s.sess), lv: 'off' }
    ]));
    view(h);
  }).catch(fail);
}

function askHealthClear() {
  confirmSheet({
    title: 'Очистить список ошибок?', sub: 'Здоровье системы',
    what: ['Список ошибок обнулится', 'На заказы и отчёты не влияет'],
    yes: 'Очистить',
    run: function () { return call('healthClear'); },
    done: function () { toast('Очищено'); apply('health', {}); }
  });
}

// ================= ИЗМЕНИТЬ ЗАКАЗ =================
function loadEdit(id, dir) {
  setHead('Изменить заказ', '');
  spin();
  call('store', { storeId: id, dir: dir || '' }).then(function (d) {
    S.edit = d;
    setHead('Изменить заказ', d.label + ' · ' + (DIRS[d.dir] ? DIRS[d.dir].short : d.dir));
    if (!d.rows.length) return view('<div class="info">Сегодня заказа нет — менять нечего.</div>');
    var rows = d.rows.map(function (r, i) {
      return '<div class="item" style="min-height:58px;padding:10px 16px">' +
        '<span class="grow"><span style="font-size:15px">' + esc(r.name) + '</span>' +
        '<span class="s">было ' + r.qty + '</span></span>' +
        '<input type="text" inputmode="decimal" data-i="' + i + '" value="' + r.qty + '" ' +
        'style="flex:none;width:92px;padding:12px;text-align:center;font-weight:600"></div>';
    }).join('');
    view('<div class="info">Впишите новое количество. <b>0</b> — убрать позицию.<br>' +
      'Если убрать всё — это то же, что отменить заказ: метка «уже заказывали» снимется.</div>' +
      section('Заказ на ' + esc(d.today) + ' · ' + esc(d.unit), '<div class="card">' + rows + '</div>') +
      '<div><button class="btn" onclick="askEdit()">Сохранить изменения</button></div>');
  }).catch(fail);
}

function askEdit() {
  var d = S.edit, ch = [], what = [], bad = '';
  Array.prototype.forEach.call(document.querySelectorAll('input[data-i]'), function (inp) {
    var r = d.rows[+inp.getAttribute('data-i')];
    var v = String(inp.value).trim().replace(',', '.');
    var q = v === '' ? 0 : Number(v);
    if (!(q >= 0) || (d.dir !== 'veg' && q % 1)) { bad = r.name; return; }
    if (q === r.qty) return;
    ch.push({ row: r.row, name: r.name, oldQty: r.qty, qty: q });
    what.push(r.name + ': ' + (q ? r.qty + ' → ' + q : 'убрать (было ' + r.qty + ')'));
  });
  if (bad) return toast('Неверное количество: ' + bad);
  if (!ch.length) return toast('Ничего не изменено');
  var id = d.id, dir = d.dir;
  confirmSheet({
    title: 'Сохранить изменения (' + ch.length + ')?', sub: d.label + ' · ' + DIRS[dir].t,
    what: what.concat(['Каждая строка перед записью сверяется с листом', 'Действие попадёт в журнал']),
    yes: 'Сохранить',
    run: function () { return call('editOrder', { storeId: id, dir: dir, changes: ch }); },
    done: function (r) {
      toast(r.left ? 'Сохранено' : 'Заказ пуст — метка снята');
      goBack();
    }
  });
}

// ================= КАРТОЧКА ТОЧКИ =================
var CARD_DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
var CARD_T = { active: 'Активна', label: 'Название', code: 'Учётный номер', route: 'Маршрут',
  note: 'Примечание', bread: 'Хлеб Рома', nbhz: 'Хлеб НБХЗ', bakery: 'Выпечка', veg: 'Овощи',
  routeNbhz: 'Маршрут НБХЗ', edrpou: 'ЄДРПОУ', daysBakery: 'Дни выпечки', daysVeg: 'Дни овощей',
  zone: 'Зона' };

function cardDaysNorm(s) {
  var t = String(s || '').split(/[\s,;]+/);
  return CARD_DAYS.filter(function (d) { return t.indexOf(d) >= 0; }).join(', ');
}
function cardFmt(v) { return v === true ? 'да' : v === false ? 'нет' : (String(v) === '' ? 'пусто' : String(v)); }

function loadCard(id) {
  setHead('Карточка точки', '');
  spin();
  call('card', { storeId: id }).then(function (c) {
    S.card = c;
    var f = c.f;
    setHead(c.label, 'строка ' + c.row + ' Довідника');

    function txt(k, label, mode, ph) {
      return '<div style="margin-top:14px"><div class="s" style="margin:0 4px 8px">' + esc(label) + '</div>' +
        '<input type="text" id="cf_' + k + '" value="' + esc(f[k]) + '"' +
        (mode ? ' inputmode="' + mode + '"' : '') + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>';
    }
    function chk(k, label, sub) {
      return '<label class="pick"><input type="checkbox" id="cf_' + k + '"' + (f[k] ? ' checked' : '') + '>' +
        '<span class="grow"><span class="t">' + esc(label) + '</span>' +
        (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span></label>';
    }
    function days(k) {
      var on = cardDaysNorm(f[k]).split(', ');
      return '<div class="chips" id="cf_' + k + '" style="margin:0">' + CARD_DAYS.map(function (d) {
        return '<button type="button" class="chip' + (on.indexOf(d) >= 0 ? ' on' : '') + '" data-d="' + d +
          '" onclick="this.classList.toggle(\'on\')">' + d + '</button>';
      }).join('') + '</div>';
    }
    var zones = [''].concat(c.zones);
    if (f.zone && zones.indexOf(f.zone) < 0) zones.push(f.zone);
    var zone = '<select id="cf_zone" style="width:100%;padding:16px;border:1px solid #DCE0E5;border-radius:16px;' +
      'background:#fff;font:inherit;color:#16181D">' + zones.map(function (z) {
        return '<option value="' + esc(z) + '"' + (z === f.zone ? ' selected' : '') + '>' +
          esc(z || '— не задана —') + '</option>';
      }).join('') + '</select>';
    var box = function (inner) { return '<div class="card" style="padding:2px 16px 18px">' + inner + '</div>'; };

    var h = '<div class="info">Адрес: <b>' + esc(c.address) + '</b><br>' +
      'Адреса здесь не меняются — по ним точка связана с заказами и отчётами.</div>';
    h += section('Основное', box(txt('label', 'Название для продавца') + txt('code', 'Учётный номер', 'numeric') +
      txt('route', 'Маршрут (Рома)') + txt('note', 'Примечание')));
    h += section('Направления', '<div class="card">' +
      chk('active', 'Активна', 'если снять — точка пропадёт у продавцов и из пульта') +
      chk('bread', 'Хлеб Рома') + chk('nbhz', 'Хлеб НБХЗ') +
      chk('bakery', 'Выпечка и кулинария') + chk('veg', 'Овощи и фрукты') + '</div>');
    h += section('Хлеб', box(txt('edrpou', 'ЄДРПОУ юрлица (пусто = ' + (c.defEdrpou || 'по умолчанию') + ')',
      'numeric', c.defEdrpou) + txt('routeNbhz', 'Маршрут НБХЗ')));
    h += section('Выпечка', '<div class="card" style="padding:16px">' +
      '<div class="s" style="margin:0 4px 10px">Дни приёма (ничего не выбрано = без ограничений)</div>' +
      days('daysBakery') + '<div class="s" style="margin:18px 4px 8px">Зона доставки</div>' + zone + '</div>');
    h += section('Овощи', '<div class="card" style="padding:16px">' +
      '<div class="s" style="margin:0 4px 10px">Дни приёма (ничего не выбрано = без ограничений)</div>' +
      days('daysVeg') + '</div>');
    h += '<div><button class="btn" onclick="askCard()">Сохранить</button></div>';
    view(h);
  }).catch(fail);
}

function askCard() {
  var c = S.card, f = c.f, set = {}, what = [];
  function el(k) { return document.getElementById('cf_' + k); }
  ['label', 'code', 'route', 'note', 'edrpou', 'routeNbhz', 'zone'].forEach(function (k) {
    var v = String(el(k).value).trim();
    if (v !== String(f[k] == null ? '' : f[k])) set[k] = v;
  });
  ['active', 'bread', 'nbhz', 'bakery', 'veg'].forEach(function (k) {
    var v = el(k).checked;
    if (v !== !!f[k]) set[k] = v;
  });
  ['daysBakery', 'daysVeg'].forEach(function (k) {
    var on = Array.prototype.map.call(document.querySelectorAll('#cf_' + k + ' .chip.on'),
      function (b) { return b.getAttribute('data-d'); });
    var v = CARD_DAYS.filter(function (d) { return on.indexOf(d) >= 0; }).join(', ');
    if (v !== cardDaysNorm(f[k])) set[k] = v;
  });

  var keys = Object.keys(set);
  if (!keys.length) return toast('Ничего не изменено');
  if ('label' in set && !set.label) return toast('Название не может быть пустым');
  if (set.code && !/^\d+$/.test(set.code)) return toast('Учётный номер — только цифры');
  if (set.edrpou && !/^\d{8}$/.test(set.edrpou)) return toast('ЄДРПОУ — 8 цифр или пусто');

  keys.forEach(function (k) { what.push(CARD_T[k] + ': ' + cardFmt(f[k]) + ' → ' + cardFmt(set[k])); });
  var dirsOn = ['bread', 'nbhz', 'bakery', 'veg'].some(function (k) { return (k in set) ? set[k] : f[k]; });
  var gone = set.active === false || !dirsOn;
  if (set.active === false) what.push('Точка пропадёт у продавцов и из пульта. Вернуть — галочкой в Довіднике');
  else if (!dirsOn) what.push('Ни одного направления — точка пропадёт у продавцов');
  if (['bread', 'nbhz', 'bakery', 'veg'].some(function (k) { return set[k] === false; }))
    what.push('Если точка уже заказала сегодня по снимаемому направлению — лучше снять вечером');
  what.push('Меняется только Довідник, принятые заказы не трогаются');

  confirmSheet({
    title: 'Сохранить изменения (' + keys.length + ')?', sub: c.label,
    what: what, yes: 'Сохранить',
    run: function () { return call('cardSave', { storeId: c.id, orig: f, set: set }); },
    done: function () { toast('Сохранено'); if (gone) tabGo('stores'); else goBack(); }
  });
}
</script>

<!-- shop-orders: на сервері немає: бэкап, дублі, позначка, збереження картки - кнопки приховано -->
<style>
#t-restore,[onclick*="'restore'"],[onclick*="'dups'"],[onclick*="askClearMark"],[onclick="askCard()"]{display:none!important}
</style>
<script>
function askCard(){ toast('Сохранение карточки - после переезда. Пока правьте Довідник ТТ.'); }
function askClearMark(){ toast('Отметок больше нет: отмените заказ или откройте приём точке.'); }
// ===== shop-orders: зв'язок з сервером замість Apps Script (вхід - cookie, токена в сторінці немає) =====
function adminPost_(action, payload) {
  return fetch('/admin/api', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: action, payload: payload || {} })
  }).then(function (r) {
    return r.json().catch(function () { return { ok: false, error: 'Ошибка связи (' + r.status + ')' }; });
  });
}
function callNet(action, payload) {
  var t0 = Date.now();
  return adminPost_(action, payload).then(function (r) {
    perfLog(action, t0, r);
    if (r && r.ok) return r.data;
    if (r && r.error === 'AUTH') { logout(); throw new Error('Нужно войти заново'); }
    throw new Error((r && r.error) || 'Ошибка связи');
  }, function (e) { perfLog(action, t0, null); throw e; });
}
function logout() {
  TOKEN = '';
  try { localStorage.removeItem('adm_token'); } catch (e) {}
  try { fetch('/admin/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}
function doLogin() {
  var pin = document.getElementById('pin').value;
  var err = document.getElementById('pinerr');
  err.textContent = 'Проверяю…';
  adminPost_('login', { pin: pin }).then(function (r) {
    if (!r || !r.ok) { err.textContent = (r && r.error) || 'Ошибка'; return; }
    err.textContent = '';
    TOKEN = 'cookie';
    start();
  }, function (e) { err.textContent = String(e.message || e); });
}
