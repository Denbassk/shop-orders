<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Закупівля · Фемелі Маркет</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('buyer_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}</script>
<style>
:root{--bg:#F2F4F5;--sf:#FFFFFF;--sf2:#F5F7F8;--ln:#E2E6E9;--tx:#14181B;--mu:#65717A;--hd:#11171A;--hdtx:#F2F6F7;--hdmu:#97A6AC;
--ok:#15803D;--okb:#E7F5EC;--teal:#0F766E;--tealb:#E2F3F1;--bad:#C81E1E;--badb:#FDECEC;--warn:#9A5B00;--warnb:#FFF4DE;
--acc:#E11B22;--acc2:#C4161C;--sh:0 1px 2px rgba(16,24,28,.05),0 4px 14px rgba(16,24,28,.06);--sh2:0 12px 30px rgba(16,24,28,.16);--r:18px;--dc:#E11B22}
[data-theme=dark]{--bg:#0E1315;--sf:#161D20;--sf2:#1C252A;--ln:#27333A;--tx:#E3EBED;--mu:#8C9DA4;--hd:#090D0F;--hdtx:#E3EBED;--hdmu:#7D8E95;
--ok:#4ADE80;--okb:rgba(74,222,128,.12);--teal:#2DD4BF;--tealb:rgba(45,212,191,.12);--bad:#F87171;--badb:rgba(248,113,113,.12);--warn:#FBBF24;--warnb:rgba(251,191,36,.12);
--acc:#E5484D;--acc2:#C9373C;--sh:0 1px 2px rgba(0,0,0,.45);--sh2:0 14px 34px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
h1,h2,h3{margin:0;letter-spacing:-.015em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.box{max-width:1440px;margin:0 auto;padding:0 clamp(12px,3vw,32px)}
.hdr{position:sticky;top:0;z-index:20;background:var(--hd);color:var(--hdtx);padding-top:14px}
.hdrin{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:22px;font-weight:800;line-height:1.2}
.hdr .sub{font-size:13px;color:var(--hdmu);margin-top:3px}
.icobtn{flex:none;width:44px;height:44px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.06);color:var(--hdtx);display:grid;place-items:center;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s}
.icobtn:hover{transform:translateY(-3px);background:rgba(255,255,255,.13)}
.dirs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-top:8px;scrollbar-width:none}
.dirs::-webkit-scrollbar{display:none}
.dirs:empty{height:14px;margin:0;padding:0}
.bm{--c:#888;flex:none;position:relative;border:0;cursor:pointer;padding:11px 18px 13px;border-radius:14px 14px 0 0;background:color-mix(in srgb,var(--c) 20%,var(--hd));color:var(--hdtx);font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px;transform:translateY(5px);transition:transform .22s cubic-bezier(.2,.8,.2,1),background .2s,box-shadow .2s}
.bm::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;border-radius:14px 14px 0 0;background:var(--c)}
.bm:hover{transform:translateY(-3px);box-shadow:0 -8px 18px rgba(0,0,0,.28)}
.bm.on{background:var(--bg);color:var(--tx);transform:translateY(0)}
.bm b{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--dc));flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--dc)) 25%,transparent)}
.wrap{padding-top:22px;padding-bottom:130px}
.stack{display:flex;flex-direction:column;gap:28px}
.stack.sm{gap:12px}
#view.anim>*{animation:fu .3s cubic-bezier(.2,.8,.2,1) both}
#view.anim>*:nth-child(2){animation-delay:.05s}
#view.anim>*:nth-child(3){animation-delay:.1s}
#view.anim>*:nth-child(4){animation-delay:.15s}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 12px 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec small{color:var(--mu);font-weight:600;letter-spacing:.03em;text-transform:none;font-size:12.5px}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.ovc{--c:var(--dc);display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px 16px 14px;box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .2s}
.ovc::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.ovc:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.ovc.on{border-color:color-mix(in srgb,var(--c) 60%,var(--ln))}
.ovc.static{cursor:default}
.ovh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ovt{font-weight:700;font-size:15px}
.ovn{margin-top:8px;font-size:14px;color:var(--mu)}
.ovn b{font-size:30px;font-weight:800;color:var(--tx);letter-spacing:-.02em;margin-right:4px}
.ovs{font-size:13.5px;font-weight:600;margin-top:4px}
.ok-t,.ovs.ok,.ds.ok{color:var(--ok)}.ovs.bad,.ds.wait{color:var(--bad)}.ovs.teal{color:var(--teal)}.ovs.warn,.ds.late{color:var(--warn)}.ovs.off,.ds.off{color:var(--mu)}
.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--c,var(--dc));border-radius:3px;transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.kpi span{display:block;font-size:12.5px;color:var(--mu);margin-top:4px}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 260px;max-width:420px;padding:11px 14px}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s}
.fchip:hover{transform:translateY(-2px)}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fchip i{font-style:normal;opacity:.6;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{--st:var(--ln);position:relative;display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 14px 12px 18px;box-shadow:var(--sh);cursor:pointer;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tile.static{cursor:default}
.tile.st-ok{--st:var(--ok)}.tile.st-wait{--st:var(--bad)}.tile.st-late{--st:var(--warn)}.tile.st-off{--st:var(--mu)}
.tile.st-off .tt{color:var(--mu)}
.tt{font-weight:700;font-size:15.5px;line-height:1.25}
.tt.big{font-size:17px;margin-top:10px}
.tr{font-size:12.5px;color:var(--mu);margin-top:3px}
.dl{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.dr{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 9px;border-radius:10px;background:var(--sf2)}
.dr .dot{width:8px;height:8px;box-shadow:none}
.dr .dn{font-weight:700}
.dr .ds{margin-left:auto;font-weight:700;white-space:nowrap}
.dr.cur{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.ta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:13px 16px;border:0;background:transparent;text-align:left;cursor:pointer;position:relative;color:var(--tx);transition:background .15s}
.item + .item{border-top:1px solid var(--ln)}
button.item:hover{background:var(--sf2)}
div.item{cursor:default}
.item.sel{background:var(--tealb)}
.item.sel::after{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--teal)}
.t{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.s{display:block;font-size:13px;color:var(--mu);margin-top:4px;line-height:1.4}
.grow{flex-grow:1;min-width:0}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px;white-space:nowrap}
.pill.open,.pill.ok{color:var(--ok);background:var(--okb)}
.pill.closed{color:var(--bad);background:var(--badb)}
.pill.late{color:var(--warn);background:var(--warnb)}
.pill.off{color:var(--mu);background:var(--sf2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border:0;border-radius:15px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn:active{background:var(--acc2);transform:none}
.btn.dark{background:var(--tx);color:var(--bg)}
.btn.dark:hover{box-shadow:var(--sh2)}
.btn.ghost{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}
.btn.ghost:hover{box-shadow:var(--sh)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn + .btn{margin-top:10px}
.btn.sm{flex:none;width:auto;height:40px;padding:0 14px;font-size:14px;border-radius:12px;margin-top:0}
input[type=search],input[type=text]{width:100%;padding:14px 16px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--tealb)}
.qty{flex:none;width:96px!important;padding:11px!important;text-align:right}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px}
.row + .row{border-top:1px solid var(--ln)}
.lbl{font-size:13px;color:var(--mu);margin:14px 2px 8px}
.hint{font-size:13.5px;color:var(--mu);margin:10px 2px}
.hint a{color:var(--teal)}
.note,.bad,.ok{border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.note{background:var(--warnb);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent)}
.bad{background:var(--badb);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 28%,transparent)}
.ok{background:var(--okb);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 28%,transparent)}
.info{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;font-size:15px;box-shadow:var(--sh)}
.spin{padding:48px 16px;text-align:center;color:var(--mu);font-size:15px}
.spin.sm{padding:18px}
.accg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.acc{--c:var(--dc);background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:22px 20px 20px;box-shadow:var(--sh);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.acc::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.acc:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.acch{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.clock{font-size:clamp(46px,6vw,62px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:12px 0 4px}
.rules{margin:12px 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rules li{position:relative;padding-left:18px}
.rules li::before{content:'';position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--c)}
.acc .btn{margin-top:auto}
.sd{--c:var(--dc);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;background:var(--sf2)}
.sdh{display:flex;align-items:center;gap:9px}
.sdh .ds{margin-left:auto;font-weight:700;font-size:13.5px}
.sds{font-size:13px;color:var(--mu);margin-top:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1 1 0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;border-radius:12px;color:var(--mu);font-size:11.5px;font-weight:600;cursor:pointer;position:relative;transition:transform .2s cubic-bezier(.2,.8,.2,1),color .18s,background .18s}
.tab:hover{transform:translateY(-3px);color:var(--tx)}
.tab.on{color:var(--dc);background:color-mix(in srgb,var(--dc) 13%,transparent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:0 5px;display:flex;align-items:center;justify-content:center}
.badge[hidden]{display:none}
.mask{position:fixed;inset:0;z-index:50;background:rgba(6,9,11,.62);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--sf);color:var(--tx);border-radius:26px 26px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--sh2)}
.grip{width:46px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 18px}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:6px}
.sheet .sub{font-size:14px;color:var(--mu);margin-bottom:16px}
label.pick{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:14px 0 16px;cursor:pointer}
label.pick input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:60;max-width:520px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:13px 16px;font-size:15px;box-shadow:var(--sh2);animation:fu .25s both}
.rpb{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.rpb[disabled]{cursor:default;opacity:.55}
.rpbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:4px}
.rpbar input{flex:1 1 240px;padding:11px 14px}
.tblw{overflow:auto;max-height:72vh;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh)}
table.gs{border-collapse:separate;border-spacing:0;font-size:13.5px;width:max-content;min-width:100%}
.gs th,.gs td{padding:8px 11px;border-bottom:1px solid var(--ln);white-space:nowrap;text-align:left;vertical-align:top;background:var(--sf)}
.gs th{position:sticky;top:0;z-index:2;background:var(--hd);color:var(--hdtx);font-weight:600;white-space:normal;min-width:60px;max-width:180px}
.gs td.n{text-align:right;font-variant-numeric:tabular-nums}
.gs tr.sec td{background:var(--sf2);font-weight:700}
.gs tr.tot td{background:var(--warnb);font-weight:700}
.gs.fc th:first-child,.gs.fc tr:not(.sec) td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--ln)}
.gs.fc th:first-child{z-index:3}
.rpgrid{display:flex;flex-direction:column;gap:24px}
@media (max-width:460px){.tiles{grid-template-columns:1fr}.hdr h1{font-size:19px}.clock{font-size:48px}}
@media (min-width:900px){
  .tabs{left:50%;right:auto;bottom:18px;transform:translateX(-50%);border:1px solid var(--ln);border-radius:20px;padding:6px;gap:4px;box-shadow:var(--sh2);background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(12px)}
  .tab{flex:none;flex-direction:row;gap:8px;padding:10px 16px;font-size:14px}
  .badge{position:static;margin-left:2px}
  .mask{align-items:center}
  .sheet{border-radius:24px;max-height:86vh}
  .hdr h1{font-size:26px}
  .toast{bottom:100px}
}
@media (min-width:1100px){.rpgrid{display:grid;grid-template-columns:360px minmax(0,1fr);align-items:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ua{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#1D4ED8;background:rgba(29,78,216,.1);border:1px solid rgba(29,78,216,.25);vertical-align:1px}
[data-theme=dark] .ua{color:#93C5FD;background:rgba(147,197,253,.12);border-color:rgba(147,197,253,.3)}
.bm.all{cursor:default;transform:translateY(0)}.bm.all:hover{transform:translateY(0);box-shadow:none}.bm.all .dot+.dot{margin-left:-3px}
.pgrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
@media (max-width:460px){.pgrid{grid-template-columns:1fr}}
.tile.st-ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--ln))!important;background:color-mix(in srgb,var(--ok) 8%,var(--sf))!important;box-shadow:inset 4px 0 0 var(--ok)}
.tile.st-ok::before{background:var(--ok)!important}
.dr.isok{border-color:color-mix(in srgb,var(--ok) 55%,transparent)!important;background:var(--okb)!important}
.ds.ok{color:var(--ok)!important;font-weight:700}
.sumd .sec .dot{display:inline-block;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<header class="hdr">
  <div class="box">
    <div class="hdrin">
      <div class="grow"><h1 id="title">Закупівля</h1><div class="sub" id="subtitle"></div></div>
      <button class="icobtn" id="thm" onclick="toggleTheme()" aria-label="Світла або темна тема" title="Світла / темна тема"></button>
      <button class="icobtn" onclick="go(S.tab)" aria-label="Оновити" title="Оновити">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
    <nav class="dirs" id="dirs"></nav>
  </div>
</header>
<main class="box wrap"><div id="view" class="stack"><div class="spin">Завантаження…</div></div></main>
<nav class="tabs">
  <button class="tab on" id="t-today" onclick="go('today')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>Сьогодні</button>
  <button class="tab" id="t-late" onclick="go('late')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Дозволи<span class="badge" id="bdg" hidden></span></button>
  <button class="tab" id="t-accept" onclick="go('accept')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Прийом</button>
  <button class="tab" id="t-reports" onclick="go('reports')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 13h6M9 17h6"/></svg>Звіти</button>
  <button class="tab" id="t-products" onclick="go('products')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>Асортимент</button>
</nav>
<div id="modal"></div>
<script>
const CODE = location.pathname.split('/')[2] || '';
const KEY = location.pathname.split('/')[3] || '';
const BASE = '/buyer/' + CODE + '/' + KEY;
const API = BASE + '/api';
const DIRC = { bread: '#D98B3A', nbhz: '#B5835A', bakery: '#F26A2E', veg: '#2FB36A' };
const SHORT = { bread: 'Хліб Рома', nbhz: 'НБХЗ', bakery: 'ВК', veg: 'Овочі' };
const S = { me: null, dir: '', tab: 'today', info: null, infos: {}, boards: {}, lates: {}, sums: {}, tiles: [], lateAll: [], late: null, products: null, q: '', f: 'all', tq: '', pend: {}, lastPend: -1, anim: false, edit: null };
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const money = (n) => (Number(n) || 0).toFixed(2);
const fmtN = (n) => (n == null ? '' : Number(n).toLocaleString('uk-UA', { maximumFractionDigits: 2 }));
const dirOf = (dir) => (S.me ? S.me.dirs.find((d) => d.dir === dir) : null) || { dir, title: dir, unit: '' };
const colorOf = (dir) => DIRC[dir] || dirOf(dir).color || '#E11B22';
const unitOf = (dir) => dirOf(dir).unit || '';
const cur = () => (S.me ? dirOf(S.dir) : null);

async function call(action, payload, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 25000);
  try {
    const r = await fetch(API, { method: 'POST', cache: 'no-store', signal: ctl.signal, headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action, payload: Object.assign({ dir: S.dir }, payload || {}) }) });
    let j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (!j) throw new Error('Сервер не відповідає (' + r.status + ')');
    if (!j.ok) throw new Error(j.error || 'Помилка');
    return j.data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер не відповідає. Спробуйте ще раз.');
    throw e;
  } finally { clearTimeout(timer); }
}
function toast(text) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 4000);
}
function view(h) { const v = $('view'); v.classList.toggle('anim', S.anim); S.anim = false; v.innerHTML = h; }
function section(title, inner, small) { return '<div><div class="sec">' + esc(title) + (small ? ' <small>' + esc(small) + '</small>' : '') + '</div>' + inner + '</div>'; }
function fail(e) { view('<div class="bad">' + esc((e && e.message) || e) + '</div>'); }
function closeSheet() { $('modal').innerHTML = ''; }
function openSheet(build) {
  $('modal').innerHTML = '<div class="mask" onclick="if (event.target === this) closeSheet()"><div class="sheet"><div class="grip"></div><div id="sh"></div></div></div>';
  build($('sh'));
}
function askSheet(title, sub, okText, fn, dark) {
  openSheet((el) => {
    el.innerHTML = '<h2 id="shh"></h2><div class="sub" id="shsub"></div><button class="btn' + (dark ? ' dark' : '') + '" id="shok"></button><button class="btn ghost" onclick="closeSheet()">Скасувати</button>';
    $('shh').textContent = title; $('shsub').textContent = sub; $('shok').textContent = okText;
    $('shok').onclick = () => { closeSheet(); fn(); };
  });
}
const kpi = (v, k, cls) => '<div class="kpi ' + (cls || '') + '"><b>' + esc(v) + '</b><span>' + esc(k) + '</span></div>';

// ---- тема ----
const ICO_SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICO_MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeIco() { const b = $('thm'); if (b) b.innerHTML = document.documentElement.dataset.theme === 'dark' ? ICO_SUN : ICO_MOON; }
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('buyer_theme', t); } catch (e) { /* приватний режим */ }
  themeIco();
}

// ---- час і тексти ----
const KYIV = new Intl.DateTimeFormat('uk-UA', { timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const nowHM = () => KYIV.format(new Date());
function minsTo(dl) { if (!dl) return null; const a = String(dl).split(':'), b = nowHM().split(':'); return (+a[0] * 60 + +a[1]) - (+b[0] * 60 + +b[1]); }
const durText = (m) => (m >= 60 ? Math.floor(m / 60) + ' год' + (m % 60 ? ' ' + (m % 60) + ' хв' : '') : m + ' хв');
function stOf(i) {
  if (!i) return { cls: 'off', t: 'немає даних' };
  if (i.openAll) return { cls: 'ok', t: 'Відкрито всім до кінця дня' };
  if (!i.deadline) return { cls: 'teal', t: 'Без дедлайну' };
  if (i.closed) return { cls: 'bad', t: 'Прийом закрито о ' + i.deadline };
  const m = minsTo(i.deadline);
  return { cls: m != null && m <= 30 ? 'warn' : 'teal', t: 'Прийом до ' + i.deadline + (m > 0 ? ' · ще ' + durText(m) : '') };
}
const RU_UA = { 'Вс': 'Нд', 'каждый день': 'щодня', 'без ограничений': 'без обмежень', 'воскресенье': 'неділю', 'понедельник': 'понеділок', 'вторник': 'вівторок', 'среда': 'середу', 'четверг': 'четвер', 'пятница': "п'ятницю", 'суббота': 'суботу' };
const ua = (s) => String(s || '').replace(/каждый день|без ограничений|воскресенье|понедельник|вторник|среда|четверг|пятница|суббота|Вс/g, (w) => RU_UA[w]);

function head() {
  const i = S.info, d = cur();
  $('title').textContent = d ? d.title : 'Закупівля';
  const st = stOf(i);
  $('subtitle').textContent = (S.me && S.me.title ? S.me.title + ' · ' : '') + (i ? st.t : '') + (i && i.reportAt ? ' · звіт о ' + i.reportAt : '');
  document.documentElement.style.setProperty('--dc', colorOf(S.dir));
  if (isShared()) { $('title').textContent = ({ late: 'Дозволи', accept: 'Прийом', today: 'Сьогодні' })[S.tab] || ''; $('subtitle').textContent = 'Усі напрямки: ' + S.me.dirs.map((d) => d.title).join(', '); }
}
function isShared() { return (S.tab === 'late' || S.tab === 'accept' || S.tab === 'today') && !!S.me && S.me.dirs.length > 1; }
function chips() {
  if (!S.me) return;
  if (isShared()) {
    const n = Object.values(S.pend).reduce((a, b) => a + (b || 0), 0);
    $('dirs').innerHTML = '<div class="bm on all" style="--c:var(--teal)">' + S.me.dirs.map((d) => '<span class="dot" style="--c:' + colorOf(d.dir) + '"></span>').join('') + 'Усі напрямки' + (n ? '<b>' + esc(n) + '</b>' : '') + '</div>';
    return;
  }
  $('dirs').innerHTML = S.me.dirs.map((d, k) => '<button class="bm' + (d.dir === S.dir ? ' on' : '') + '" style="--c:' + colorOf(d.dir) + '" onclick="setDir(' + k + ')"><span class="dot"></span>' + esc(d.title) + (S.pend[d.dir] ? '<b>' + esc(S.pend[d.dir]) + '</b>' : '') + '</button>').join('');
}
function setDir(k) {
  S.dir = S.me.dirs[k].dir;
  try { localStorage.setItem('buyer_dir_' + CODE, S.dir); } catch (e) { /* приватний режим */ }
  S.late = S.products = null; S.info = S.infos[S.dir] || null; S.q = ''; S.f = 'all';
  chips(); head(); go(S.tab);
}
const TABS = { today: showToday, late: showLate, accept: showAccept, reports: showReports, products: showProducts };
async function go(tab) {
  S.tab = tab;
  chips();
  Object.keys(TABS).forEach((t) => $('t-' + t).classList.toggle('on', t === tab));
  view('<div class="spin">Завантаження…</div>');
  S.anim = true;
  try { S.info = await call('info'); S.infos[S.dir] = S.info; head(); await TABS[tab](); } catch (e) { fail(e); }
}
const refresh = () => TABS[S.tab](true).catch(fail);

// ---- дані всіх напрямків закупниці ----
async function loadAll() {
  await Promise.all(S.me.dirs.map(async (d) => {
    const [i, b, l] = await Promise.all([
      call('info', { dir: d.dir }).catch(() => S.infos[d.dir] || null),
      call('board', { dir: d.dir }).catch((e) => ({ error: e.message })),
      call('late', { dir: d.dir }).catch(() => null)]);
    S.infos[d.dir] = i; S.boards[d.dir] = b;
    if (l) { S.lates[d.dir] = l; S.pend[d.dir] = l.pending; }
  }));
  S.info = S.infos[S.dir]; head(); badge();
}
function storesAll() {
  const m = new Map();
  S.me.dirs.forEach((d) => {
    const b = S.boards[d.dir];
    if (!b || b.error) return;
    [['ok', b.done], ['wait', b.wait], ['off', b.off]].forEach(([st, list]) => (list || []).forEach((r) => {
      let s = m.get(r.id);
      if (!s) { s = { id: r.id, label: r.label, route: r.route || '', code: r.code || '', ua: !!r.ua, d: {} }; m.set(r.id, s); }
      if (r.ua) s.ua = true;
      s.d[d.dir] = { st, gs: !!r.gs, n: r.n, qty: r.qty, time: r.time, days: r.days, next: r.next };
    }));
  });
  Object.keys(S.lates).forEach((dir) => (S.lates[dir].list || []).forEach((x) => { const s = m.get(x.storeId); if (s && s.d[dir]) s.d[dir].late = x; }));
  return [...m.values()].sort((a, b) => a.label.localeCompare(b.label, 'uk'));
}
function cellOf(dir, c) {
  if (c.st === 'ok') return { cls: 'ok', t: 'Зроблено' + (c.gs ? '' : (c.qty != null ? ' · ' + fmtN(c.qty) + ' ' + unitOf(dir) : '') + (c.time ? ' · ' + c.time : '')) };
  if (c.late && c.late.status === 'pending') return { cls: 'late', t: 'просить дозвіл' };
  if (c.late && c.late.status === 'approved') return { cls: 'late', t: 'дозвіл ' + c.late.leftMin + ' хв' };
  if (c.st === 'off') return { cls: 'off', t: c.next ? 'наступне ' + ua(c.next) : 'не сьогодні' };
  const i = S.infos[dir] || {};
  return { cls: 'wait', t: i.closed && !i.openAll ? 'не замовила' : 'чекаємо' };
}

// ---- Сьогодні ----
async function showToday(quiet) { await showTodayBase(quiet); }
async function showTodayBase(quiet) {
  await loadAll();
  if (S.tab !== 'today') return;
  if (!quiet || !$('tdroot')) {
    view('<div id="tdroot" class="stack">' + section('Напрямки зараз', '<div id="ov"></div>', 'час за Києвом ' + nowHM()) +
      '<div id="tdsum"></div>' +
      '<div><div class="sec">Торгові точки <small id="tdcnt"></small></div>' +
      '<div class="tools"><input type="search" id="tq" placeholder="Пошук: адреса, маршрут, код" value="' + esc(S.tq) + '" oninput="S.tq = this.value; renderTiles()"><div class="fl" id="fl"></div></div>' +
      '<div class="tiles" id="tiles"></div></div><div id="tdtop"></div></div>');
  }
  gsApply();
  $('ov').innerHTML = ovHtml();
  S.tiles = storesAll(); renderTiles();
  const ds = S.me.dirs.map((d) => d.dir).filter((x) => isShared() || x === S.dir);
  if (isShared()) sumAll(); else if (S.sums[S.dir]) sumDraw(S.sums[S.dir]); else $('tdsum').innerHTML = '<div class="spin sm">Читаю таблицю Google…</div>';
  const er = {};
  await Promise.all(ds.map((x) => call('summary', { dir: x }, 60000).then((d) => { S.sums[x] = d; }).catch((e) => { er[x] = e.message; })));
  if (S.tab !== 'today' || !$('tdsum')) return;
  gsApply();
  $('ov').innerHTML = ovHtml(); S.tiles = storesAll(); renderTiles();
  if (isShared()) sumAll(er);
  else if (er[S.dir]) $('tdsum').innerHTML = '<div class="note">' + esc('Таблиця Google: ' + er[S.dir]) + '</div>';
  else if (S.sums[S.dir]) sumDraw(S.sums[S.dir]);
}
function aggCls(s) {
  const cs = S.me.dirs.filter((d) => s.d[d.dir]).map((d) => cellOf(d.dir, s.d[d.dir]).cls);
  return ['ok', 'late', 'wait', 'off'].find((z) => cs.includes(z)) || 'none';
}
function gsn(v) {
  return String(v || '').split(' · ')[0].toLowerCase().replace(/\(.*?\)/g, ' ')
    .replace(/(^|[^a-zа-яіїєґ])(м|г|вул|вулиця|ул|улица|пр|просп|проспект|пров|пер|пл|площа|бул|бульвар|харків|харьков|магазин|юа)(?=[^a-zа-яіїєґ]|$)/gi, ' ')
    .replace(/[^a-zа-яіїєґ0-9]/gi, '');
}
function gsApply() {
  S.gsNote = {};
  S.me.dirs.forEach((d) => {
    const b = S.boards[d.dir], x = S.sums[d.dir];
    if (!b || b.error || !b.wait || !x || !Array.isArray(x.missing)) return;
    const miss = x.missing.map(gsn).filter(Boolean);
    const hit = (m, r) => { const n = gsn(r.label); return !!n && (m === n || m.endsWith(n)); };
    const all = b.wait.concat(b.done || [], b.off || []);
    const lost = miss.filter((m) => !all.some((r) => hit(m, r))).length;
    if (lost > 2) { S.gsNote[d.dir] = lost; return; }
    const stay = [], moved = [];
    b.wait.forEach((r) => (miss.some((m) => hit(m, r)) ? stay : moved).push(r));
    if (!moved.length) return;
    b.wait = stay;
    b.done = (b.done || []).concat(moved.map((r) => Object.assign({}, r, { gs: true })));
  });
}
function sumAll(er) {
  er = er || {};
  $('tdsum').innerHTML = '<div class="stack sm">' + S.me.dirs.map((d) => {
    const x = S.sums[d.dir], e = er[d.dir], ln = (S.gsNote || {})[d.dir];
    const body = e ? '<div class="note">' + esc('Таблиця Google: ' + e) + '</div>'
      : !x ? '<div class="spin sm">Читаю таблицю Google…</div>'
      : (x.stats && x.stats.length ? '<div class="kpis">' + x.stats.map((s) => kpi(s.v, s.k)).join('') + '</div>' : '<div class="note">' + esc(x.note || 'Немає даних') + '</div>');
    return '<div class="sumd" style="--c:' + colorOf(d.dir) + '"><div class="sec"><span class="dot"></span> ' + esc(d.title) + ' <small>' + esc('з таблиці Google' + (x && x.note ? ' · ' + x.note : '') + (ln ? ' · не зіставлено адрес: ' + ln : '')) + '</small></div>' + body + '</div>';
  }).join('') + '</div>';
  if ($('tdtop')) $('tdtop').innerHTML = '';
}
function ovHtml() {
  return '<div class="ov">' + S.me.dirs.map((d, k) => {
    const b = S.boards[d.dir] || {}, i = S.infos[d.dir];
    const done = (b.done || []).length, tot = done + (b.wait || []).length, off = (b.off || []).length;
    const st = b.error ? { cls: 'bad', t: 'немає даних: ' + b.error } : (!tot && off ? { cls: 'off', t: 'Сьогодні не день замовлень' } : stOf(i));
    const p = S.pend[d.dir] ? '<span class="pill late">' + esc(S.pend[d.dir] + ' дозв.') + '</span>' : '';
    return '<button class="ovc' + (d.dir === S.dir ? ' on' : '') + '" style="--c:' + colorOf(d.dir) + '" onclick="setDir(' + k + ')"><div class="ovh"><span class="ovt">' + esc(d.title) + '</span>' + p + '</div>' +
      '<div class="ovn"><b>' + done + '</b>з ' + tot + ' точок</div><div class="bar"><i style="width:' + (tot ? Math.round(done * 100 / tot) : 0) + '%"></i></div>' +
      '<div class="ovs ' + st.cls + '">' + esc(st.t) + '</div></button>';
  }).join('') + '</div>';
}
const FL = [['all', 'Усі'], ['ok', 'Замовили'], ['wait', 'Чекаємо'], ['late', 'Дозволи'], ['off', 'Не їхній день'], ['ua', 'ЮА Маркет']];
function match(s, f) {
  if (f === 'all') return true;
  if (f === 'ua') return !!s.ua;
  const g = ({ done: 'ok', ordered: 'ok' })[f] || f;
  const cs = S.me.dirs.filter((d) => s.d[d.dir]).map((d) => cellOf(d.dir, s.d[d.dir]).cls);
  return g === 'off' ? cs.length > 0 && cs.every((z) => z === 'off') : cs.includes(g);
}
function setF(f) { S.f = f; renderTiles(); }
function renderTiles() {
  const box = $('tiles'); if (!box) return;
  const b = S.boards[S.dir];
  if (b && b.error) { box.innerHTML = '<div class="bad">' + esc('Точки: ' + b.error + ' (перезапустіть сервер: npm start)') + '</div>'; return; }
  const q = S.tq.trim().toLowerCase();
  const base = S.tiles.filter((s) => !q || (s.label + ' ' + s.route + ' ' + s.code).toLowerCase().includes(q));
  $('fl').innerHTML = FL.filter(([f]) => f !== 'ua' || S.tiles.some((s) => s.ua)).map(([f, t]) => '<button class="fchip' + (S.f === f ? ' on' : '') + '" onclick="setF(\'' + f + '\')">' + esc(t) + '<i>' + base.filter((s) => match(s, f)).length + '</i></button>').join('');
  const list = base.filter((s) => match(s, S.f));
  $('tdcnt').textContent = list.length + ' з ' + S.tiles.length;
  box.innerHTML = list.length ? list.map((s) => tileHtml(s, S.tiles.indexOf(s))).join('') : '<div class="info">Нічого не знайдено</div>';
}
function tileHtml(s, k) {
  const x = { cls: aggCls(s) };
  const rows = S.me.dirs.filter((d) => s.d[d.dir]).map((d) => {
    const y = cellOf(d.dir, s.d[d.dir]);
    return '<div class="dr' + (d.dir === S.dir && !isShared() ? ' cur' : '') + (y.cls === 'ok' ? ' isok' : '') + '" style="--c:' + colorOf(d.dir) + '"><span class="dot"></span><span class="dn">' + esc(SHORT[d.dir] || d.title) + '</span><span class="ds ' + y.cls + '">' + esc(y.t) + '</span></div>';
  }).join('');
  return '<button class="tile st-' + (x ? x.cls : 'none') + '" onclick="openStore(' + k + ')"><div class="tt">' + esc(s.label) + '</div>' + ((s.route || s.ua) ? '<div class="tr">' + esc(s.route || '') + (s.ua ? '<span class="ua">ЮА Маркет</span>' : '') + '</div>' : '') + '<div class="dl">' + rows + '</div></button>';
}
function tdRow(name, val) {
  return '<div class="item"><span class="grow"><span class="t">' + name + '</span></span><span class="pill off">' + val + '</span></div>';
}
function sumDraw(d) {
  const at = d.at ? new Date(d.at).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) : '';
  let h = '<div class="sec">З таблиці Google <small>' + esc([d.note, at].filter(Boolean).join(' · ')) + '</small></div>';
  h += d.stats && d.stats.length ? '<div class="kpis">' + d.stats.map((s) => kpi(s.v, s.k)).join('') + '</div>' : '<div class="note">' + esc(d.note || 'Немає даних') + '</div>';
  $('tdsum').innerHTML = h;
  const u = d.unit ? ' ' + d.unit : '';
  const cols = [];
  if (d.top && d.top.length) cols.push(section('Топ позицій', '<div class="card">' +
    d.top.map((x) => tdRow(esc(x.name), esc(fmtN(x.qty) + u + (x.sum != null ? ' · ' + fmtN(x.sum) + ' грн' : '')))).join('') + '</div>'));
  if (d.groups && d.groups.list && d.groups.list.length) cols.push(section(d.groups.title, '<div class="card">' +
    d.groups.list.map((x) => tdRow(esc(x.name), esc(fmtN(x.qty) + u))).join('') + '</div>'));
  $('tdtop').innerHTML = cols.length ? '<div class="cols">' + cols.join('') + '</div>' : '';
}

// ---- картка точки ----
function openStore(k) {
  const s = S.tiles[k];
  openSheet((el) => {

// ---- Звіти: листи Google (src/buyer/sheets.js), лише перегляд ----
const RP = { dir: '', list: null, key: '', data: null, q: '', t: 0 };
const NUM_RE = /^-?[\d\s\u00a0]+([.,]\d+)?( ?(грн|шт|кг|%))?$/;
const TOT_RE = /^(разом|всього|итого|всего|итог|загалом)/i;
function rpCard(s, k) {
  return '<div class="item' + (s.key === RP.key ? ' sel' : '') + '">' +
    '<button class="grow rpb" ' + (s.missing ? 'disabled' : 'onclick="rpPick(' + k + ')"') + '><span class="t">' + esc(s.title) +
    '</span><span class="s">' + esc(s.about || '') + '</span></button>' +
    (s.missing ? '<span class="pill off">немає листа</span>' : '<button class="btn sm dark" onclick="download(' + k + ')">⬇ Excel</button>') + '</div>';
}
async function showReports(fresh) {
  if (RP.dir !== S.dir) { RP.dir = S.dir; RP.key = ''; RP.data = null; RP.q = ''; }
  const l = RP.list = await call('sheets', { fresh: !!fresh }, 60000);
  const ok = l.sheets.filter((s) => !s.missing);
  if (!ok.some((s) => s.key === RP.key)) { const m = ok.find((s) => s.main) || ok[0]; RP.key = m ? m.key : ''; RP.data = null; }
  const grp = (g) => l.sheets.map((s, k) => [s, k]).filter(([s]) => (s.group || 'report') === g);
  const rep = grp('report'), ext = grp('extra');
  let h = section('Звіти', '<div class="card">' + rep.map(([s, k]) => rpCard(s, k)).join('') + '</div>');
  if (ext.length) h += section('Довідники і службові листи', '<div class="card">' + ext.map(([s, k]) => rpCard(s, k)).join('') + '</div>');
  h += l.mode === 'target'
    ? '<div class="note">Тестова таблиця (BUYER_SHEETS=target).</div><button class="btn ghost" onclick="askReport()">Перезібрати звіт</button>'
    : '<div class="hint">Бойові таблиці, лише перегляд. Звіти збирає Apps Script кожні 5 хвилин.</div>';
  view('<div class="rpgrid"><div class="stack">' + h + '</div><div id="rpv">' + (RP.key ? '<div class="spin">Завантажую лист…</div>' : '<div class="note">Листів у таблиці не знайдено.</div>') + '</div></div>');
  if (RP.key) rpLoad(fresh);
}
function rpPick(k) { RP.key = RP.list.sheets[k].key; RP.q = ''; RP.data = null; showReports().catch(fail); }
async function rpLoad(fresh) {
  const key = RP.key, dir = S.dir;
  if (fresh === true && RP.data) toast('⏳ Оновлюю лист…');
  try {
    const d = await call('sheet', { key, fresh: !!fresh }, 60000);
    if (key !== RP.key || dir !== S.dir) return;
    RP.data = d; rpDraw();
  } catch (e) { const b = document.getElementById('rpv'); if (b) b.innerHTML = '<div class="bad">' + esc(e.message) + '</div>'; }
}
function rpSplit() {
  const rows = RP.data.rows.filter((r) => r.some((v) => v.trim() !== ''));
  const hi = rows.findIndex((r) => r.filter((v) => v.trim() !== '').length >= 2);
  return { cap: hi > 0 ? rows.slice(0, hi).map((r) => r.filter((v) => v.trim()).join(' ')).join(' · ') : '',
    head: hi >= 0 ? rows[hi] : null, body: hi >= 0 ? rows.slice(hi + 1) : rows };
}
function rpDraw() {
  const box = document.getElementById('rpv'), d = RP.data;
  if (!box || !d) return;
  const k = RP.list.sheets.findIndex((s) => s.key === RP.key);
  const sp = rpSplit();
  box.innerHTML = section(d.title, (sp.cap ? '<div class="hint">' + esc(sp.cap) + '</div>' : '') +
    '<div class="rpbar"><input type="search" placeholder="Пошук: точка, товар, маршрут" value="' + esc(RP.q) + '" oninput="rpSearch(this.value)">' +
    '<button class="btn sm ghost" onclick="rpLoad(true)">Оновити</button>' +
    '<button class="btn sm dark" onclick="download(' + k + ')">Скачати Excel</button></div>' +
    '<div class="hint" id="rpc"></div><div class="tblw" id="rpt"></div>');
  rpTable();
}
function rpSearch(v) { RP.q = v; clearTimeout(RP.t); RP.t = setTimeout(rpTable, 200); }
function rpTable() {
  const d = RP.data, t = document.getElementById('rpt'), c = document.getElementById('rpc');
  if (!d || !t) return;
  const { head, body } = rpSplit(), w = d.width, LIM = 1500;
  const q = RP.q.trim().toLowerCase();
  const shown = q ? body.filter((r) => r.join(' ').toLowerCase().includes(q)) : body;
  const tr = (r) => {
    const ne = r.filter((v) => v.trim() !== '');
    if (w > 2 && ne.length === 1 && !NUM_RE.test(ne[0].trim())) return '<tr class="sec"><td colspan="' + w + '">' + esc(ne[0]) + '</td></tr>';
    const tot = r.some((v) => TOT_RE.test(v.trim()));
    return '<tr' + (tot ? ' class="tot"' : '') + '>' + r.map((v) => '<td' + (NUM_RE.test(v.trim()) ? ' class="n"' : '') + '>' + esc(v) + '</td>').join('') + '</tr>';
  };
  t.innerHTML = '<table class="gs' + (w > 5 ? ' fc' : '') + '">' +
    (head ? '<thead><tr>' + head.map((v) => '<th>' + esc(v) + '</th>').join('') + '</tr></thead>' : '') +
    '<tbody>' + shown.slice(0, LIM).map(tr).join('') + '</tbody></table>';
  const at = d.at ? new Date(d.at).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) : '';
  c.innerHTML = esc(shown.length + ' рядків' + (q ? ' з ' + body.length : '') + (at ? ' · прочитано о ' + at : '') +
    (d.cut ? ' · у листі більше 3000 рядків' : '') + (shown.length > LIM ? ' · показано ' + LIM + ', решта - в Excel' : '')) +
    (RP.list.url ? ' · <a href="' + esc(RP.list.url) + '" target="_blank" rel="noopener">відкрити в Google</a>' : '');
}
async function download(k) {
  const s = RP.list && RP.list.sheets[k];
  if (!s) return;
  toast('⏳ Готую файл «' + s.title + '»…');
  try {
    const r = await fetch(BASE + '/xlsx/' + S.dir + '?key=' + encodeURIComponent(s.key), { cache: 'no-store' });
    if (!r.ok) { let j = null; try { j = await r.json(); } catch (e) { j = null; } throw new Error((j && j.error) || ('Помилка ' + r.status)); }
    const m = /filename\*=UTF-8''([^;]+)/.exec(r.headers.get('content-disposition') || '');
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href = url; a.download = m ? decodeURIComponent(m[1]) : 'report.xlsx';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('Файл завантажено');
  } catch (e) { toast('❌ ' + e.message); }
}
function askReport() {

      '<div class="hint"></div><button class="btn dark" id="shok">Зберегти</button><button class="btn ghost" onclick="closeSheet()">Скасувати</button>';
    $('shh').textContent = p.name; $('shsub').textContent = prodSub(p);
    $('pp').value = money(p.price); $('ps').checked = !!p.stop;
    if (av) $('pa').value = p.availability || '';
    $('shok').onclick = () => saveProduct(i);
  });
}
async function saveProduct(i) {
  const p = S.products.products[i], av = S.products.hasAvailability;
  const body = { id: p.id, price: $('pp').value, stop: $('ps').checked };
  if (av) body.availability = $('pa').value;
  const b = $('shok'); b.disabled = true; b.textContent = 'Зберігаю…';
  try {
    const r = await call('setProduct', body);
    if ('price' in r) p.price = r.price;
    if ('status' in r) p.stop = r.status === 'stop';
    if ('availability' in r) p.availability = r.availability;
    closeSheet(); toast('Збережено: ' + p.name); renderProducts();
  } catch (e) { b.disabled = false; b.textContent = 'Зберегти'; toast('❌ ' + e.message); }
}

// ---- старт і автооновлення ----
async function start() {
  themeIco();
  try { S.me = await call('me'); } catch (e) { return fail(e); }
  let saved = '';
  try { saved = localStorage.getItem('buyer_dir_' + CODE) || ''; } catch (e) { saved = ''; }
  S.dir = S.me.dirs.some((d) => d.dir === saved) ? saved : S.me.dirs[0].dir;
  chips(); head(); go('today');
}
setInterval(() => {
  if (document.hidden || !S.me || $('modal').innerHTML) return;
  if (S.tab === 'today' || S.tab === 'late' || S.tab === 'accept') TABS[S.tab](true).catch(() => {});
  else pollLate();
}, 30000);
start();
</script>
