<!-- Экран «Ассортимент и цены» направления (направление -> Управление приёмом): список позиций, поиск, выбор галочками, массовая смена цен
     на % или на сумму, перегляд «Было -> Стало» перед сохранением, подтверждение. Действия assortment / priceBulkPreview / priceBulkApply (src/admin/assortment.js).
     Овощи: цены приходят из прайса поставщика сами - только просмотр (priceLocked). Вставляется в конец страницы скриптом build-admin.js после admin-deadline.html;
     app/ui не меняется (пункт меню вставляет build-admin.js). Тексты - по-русски, как весь пульт. -->
<style>
.asbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.asbar button{flex:1 1 150px;padding:12px 10px;border:1px solid var(--ln,#DCE0E5);border-radius:14px;background:var(--sf,#fff);color:var(--tx,#16181D);font:inherit;font-weight:600;cursor:pointer}
.ascnt{margin:14px 4px 0;font-size:14px;font-weight:600}
.asrow{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln,#DCE0E5)}
.asrow:last-child{border-bottom:0}
.asrow .nm{flex:1;min-width:0;font-size:15px;line-height:1.35}
.asrow .pr{flex:none;white-space:nowrap;font-weight:600}
.asrow .pr s{opacity:.55;font-weight:400}
.asrow .up,.pick .right .up{color:#B3261E}.asrow .dn,.pick .right .dn{color:#166B3A}
.asstop{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#7A828E;color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
.ashead{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;border-bottom:1px solid var(--ln,#DCE0E5)}
.asstopb{border-color:var(--warn)!important;color:var(--warn)!important}
.asacc{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#1565C0;color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
.asacc.ex{background:#6A1B9A}
.astools{margin:12px 0}
@media (max-width:520px){.astools input[type=search]{max-width:none;flex-basis:100%}}
.asprice{margin-top:16px;border-top:1px solid var(--ln,#DCE0E5)}
.asprice summary{cursor:pointer;font-weight:700;padding:14px 4px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.asprice summary::-webkit-details-marker{display:none}
.asprice summary::after{content:"▾";opacity:.6;transition:transform .15s}
.asprice[open] summary::after{transform:rotate(180deg)}
</style>
<script>
// ===== shop-orders: ассортимент и цены =====
var AS = { dir: '', d: null, q: '', f: 'all', sel: {}, mode: 'pct', value: '' };

function asMoney(n) { return (Math.round(Number(n) * 100) / 100).toFixed(2); }
function asNum(s) { return Number(String(s == null ? '' : s).trim().replace(',', '.')); }
function asChange(mode, value) {
  var v = asNum(value);
  return mode === 'pct' ? (v > 0 ? '+' : '') + v + '%' : (v > 0 ? '+' : '') + v + ' грн';
}

function loadAssort(k, keep) {
  var m = DIRS[k];
  setHead('Ассортимент', m.t);
  spin();
  call('assortment', { dir: k }).then(function (d) {
    AS = { dir: k, d: d, q: keep ? keep.q : '', f: keep ? keep.f : 'all', sel: {}, mode: 'pct', value: '' };
    drawAssort();
  }).catch(fail);
}

// индексы позиций после фильтра (все / активные / на стопе) и поиска
function asFiltered() {
  var q = AS.q.trim().toLowerCase(), out = [];
  AS.d.products.forEach(function (p, i) {
    if (AS.f === 'active' && p.stop) return;
    if (AS.f === 'stop' && !p.stop) return;
    if (AS.f === 'acc' && p.access.mode === 'all') return;
    if (!q || (p.name + ' ' + p.barcode).toLowerCase().indexOf(q) >= 0) out.push(i);
  });
  return out;
}

function asFilter(f) { AS.f = f; fillAssortList(); }

function drawAssort() {
  var d = AS.d, h = '';
  if (d.priceLocked) {
    h += '<div class="note">' + esc(d.lockedReason) + '. Цены здесь только смотреть; ставить позиции на стоп можно.</div>';
    h += '<div class="card" style="padding:16px;margin-bottom:14px"><div class="ascnt" style="margin:0 4px 6px">Новые позиции в прайсе</div>' +
      '<div class="s" style="margin:0 4px 12px">Проверить прайс поставщика на позиции, которых ещё нет в ассортименте.</div>' +
      '<button class="btn" type="button" onclick="vnPreview()">Проверить прайс</button></div>';
  }
  else if (d.hidePrice) h += '<div class="note">Продавцы этого направления цен не видят, но цены используются в расчётах.</div>';
  if (d.incoming) {
    var ic = d.incoming, when = ic.checkedAt ? incWhen(ic.checkedAt) : '';
    h += '<div class="card incbox" style="padding:16px;margin-bottom:14px"><div class="ascnt" style="margin:0 4px 6px">Входящие цены из приходов</div>' +
      '<div class="' + (ic.n ? 'note' : 's') + '" style="margin:0 4px 12px">' +
      (ic.n ? 'Входящая цена изменилась у ' + ic.n + ' поз. — в прайсе ещё старые.' + (ic.big ? ' С изменением больше 30%: ' + ic.big + '.' : '')
            : 'Расхождений с приходами не найдено' + (when ? ' (проверено ' + esc(when) + ')' : '') + '.') +
      (ic.n && when ? ' Проверено ' + esc(when) + '.' : '') + '</div>' +
      '<button class="btn" type="button" onclick="incPreview()">Подтянуть цены из приходов</button></div>';
  }
  h += '<div class="atools astools"><input type="search" id="as_q" class="atq" placeholder="Поиск по названию или штрихкоду" value="' + attr(AS.q) + '">' +
    '<span id="as_chips" style="display:contents"></span></div>';
  h += '<div class="card" style="padding:16px">' +
    '<div class="ascnt" id="as_cnt" style="margin:0 4px 10px"></div>' +
    '<div class="asbar" style="margin-top:0">' +
      '<button type="button" onclick="asSelectFound()">Выбрать все найденные</button>' +
      '<button type="button" onclick="asClear()">Снять выбор</button>' +
    '</div>' +
    '<div class="asbar">' +
      '<button type="button" class="asstopb" onclick="askAssortStop(true)">Поставить на стоп</button>' +
      '<button type="button" onclick="askAssortStop(false)">Снять со стопа</button>' +
    '</div>' +
    '<div class="asbar">' +
      '<button type="button" onclick="openAccess()">Доступ по точкам</button>' +
    '</div>';
  if (!d.priceLocked) {
    // на ноутбуке блок цен открыт сразу; на телефоне свёрнут (чтобы список был рядом), если там уже не вписано значение
    h += '<details class="asprice"' + (window.innerWidth > 700 || String(AS.value).trim() ? ' open' : '') + '><summary>Изменить цены у отмеченных позиций</summary>' +
      '<div class="chips" id="as_mode" style="margin:12px 0 12px">' +
        '<button type="button" class="chip" data-m="pct" onclick="asMode(\'pct\')">На %</button>' +
        '<button type="button" class="chip" data-m="sum" onclick="asMode(\'sum\')">На сумму</button>' +
      '</div>' +
      '<div class="s" id="as_lbl" style="margin:0 4px 8px"></div>' +
      '<input type="text" id="as_val" inputmode="decimal" autocomplete="off" placeholder="Например 5 или -3,5" value="' + attr(AS.value) + '">' +
      '<div style="margin-top:14px"><button class="btn" onclick="previewAssort()">Посмотреть изменения</button></div></details>';
  }
  h += '</div><div id="as_list" style="margin-top:18px"></div>';
  view(h);
  var q = document.getElementById('as_q');
  q.addEventListener('input', function () { AS.q = q.value; fillAssortList(); });
  var v = document.getElementById('as_val');
  if (v) v.addEventListener('input', function () { AS.value = v.value; });
  asMode(AS.mode);
  fillAssortList();
}

function asMode(m) {
  AS.mode = m;
  var chips = document.querySelectorAll('#as_mode .chip');
  for (var i = 0; i < chips.length; i++) chips[i].className = 'chip' + (chips[i].getAttribute('data-m') === m ? ' on' : '');
  var l = document.getElementById('as_lbl');
  if (l) l.textContent = m === 'pct' ? 'На сколько процентов (минус — снизить)' : 'На сколько гривен (минус — снизить)';
}

function fillAssortList() {
  var el = document.getElementById('as_list');
  if (!el) return;
  var d = AS.d, idx = asFiltered();
  var nStop = d.products.filter(function (p) { return p.stop; }).length;
  var nAcc = d.products.filter(function (p) { return p.access.mode !== 'all'; }).length;
  var defs = [['all', 'Все', d.products.length], ['active', 'Активные', d.products.length - nStop], ['stop', 'На стопе', nStop]];
  if (nAcc || AS.f === 'acc') defs.push(['acc', 'Не всем точкам', nAcc]);
  document.getElementById('as_chips').innerHTML = defs.map(function (x) {
    return '<button type="button" class="achip' + (AS.f === x[0] ? ' on' : '') + '" onclick="asFilter(\'' + x[0] + '\')">' + x[1] + '<i>' + x[2] + '</i></button>';
  }).join('');
  if (!idx.length) {
    var nothing = (AS.f === 'stop' || AS.f === 'acc') && !AS.q.trim();
    el.innerHTML = '<div class="' + (nothing ? 'ok' : 'note') + '">' + (nothing ? (AS.f === 'stop' ? 'Сейчас на стопе ничего нет' : 'Все позиции доступны всем точкам') : 'Ничего не найдено') + '</div>';
    asCount(); return;
  }
  var rows = idx.map(function (i) {
    var p = d.products[i];
    var price = esc(asMoney(p.price)) + (d.markup !== 1 ? ' <s>продавцу ' + esc(asMoney(p.sellerPrice)) + '</s>' : '');
    var sub = (p.barcode ? esc(p.barcode) : '') + (p.category ? (p.barcode ? ' · ' : '') + esc(p.category) : '');
    var name = esc(p.name) + (p.stop ? '<span class="asstop">стоп</span>' : '') + asAccBadge(p.access);
    return '<label class="pick" style="display:flex"><input type="checkbox"' + (AS.sel[p.id] ? ' checked' : '') + ' onchange="asToggle(' + i + ',this.checked)">' +
      '<span class="grow"><span class="t">' + name + '</span>' + (sub ? '<span class="s">' + sub + '</span>' : '') + '</span>' +
      '<span class="right" style="white-space:nowrap">' + price + '</span></label>';
  }).join('');
  el.innerHTML = '<div class="card">' + rows + '</div>';
  asCount();
}

// «Поставить на стоп» / «Снять со стопа» для отмеченных (assortStop): позиции, уже в нужном состоянии, сервер пропускает
function askAssortStop(stop) {
  var k = AS.dir, m = DIRS[k], ids = Object.keys(AS.sel), names = [];
  if (!ids.length) return toast('Отметьте позиции');
  AS.d.products.forEach(function (p) { if (AS.sel[p.id]) names.push(p.name); });
  confirmSheet({
    title: stop ? 'Поставить на стоп?' : 'Снять со стопа?', sub: m.t, yes: stop ? 'Поставить на стоп' : 'Снять со стопа',
    what: [names.length + ' позиций: ' + names.slice(0, 6).join(', ') + (names.length > 6 ? ' и ещё ' + (names.length - 6) : ''),
           stop ? 'Продавцы перестанут видеть эти позиции в течение минуты; уже отправленные заказы не меняются' : 'Продавцы снова увидят эти позиции в течение минуты',
           'Действие попадёт в журнал'],
    run: function () { return call('assortStop', { dir: k, ids: ids, stop: stop }); },
    done: function (res) {
      toast((stop ? 'На стопе: ' : 'Стоп снят: ') + res.changed + ' поз.' + (res.skipped ? ' (' + res.skipped + ' уже было)' : ''));
      loadAssort(k, { f: AS.f, q: AS.q });                          // свежий список, фильтр и поиск остаются
    }
  });
}

function asToggle(i, on) {
  var p = AS.d.products[i];
  if (on) AS.sel[p.id] = true; else delete AS.sel[p.id];
  asCount();
}
function asSelectFound() {
  asFiltered().forEach(function (i) { AS.sel[AS.d.products[i].id] = true; });
  fillAssortList();
}
function asClear() { AS.sel = {}; fillAssortList(); }
function asCount() {
  var c = document.getElementById('as_cnt');
  if (c) c.textContent = 'Отмечено: ' + Object.keys(AS.sel).length + ' из ' + AS.d.products.length;
}

// ===== доступ к позиции по точкам: assortAccess (src/admin/assortment.js admAssortAccess; фильтр у продавца - rules.productAllowed) =====
function asAccBadge(a) {
  if (!a || a.mode === 'all') return '';
  return '<span class="asacc' + (a.mode === 'except' ? ' ex' : '') + '">' + (a.mode === 'only' ? 'только ' : 'кроме ') + a.stores.length + ' ТТ</span>';
}
var ACC = null;
var ACC_MODES = [['all', 'Всем точкам'], ['only', 'Только отмеченным точкам'], ['except', 'Всем, кроме отмеченных']];
function openAccess() {
  var ids = Object.keys(AS.sel);
  if (!ids.length) return toast('Отметьте позиции');
  var picked = AS.d.products.filter(function (p) { return AS.sel[p.id]; });
  var key = function (a) { return a.mode + ':' + a.stores.slice().sort().join('|'); };
  var same = picked.every(function (p) { return key(p.access) === key(picked[0].access); });
  var start = same ? picked[0].access : { mode: 'all', stores: [] };
  var sel = {};
  start.stores.forEach(function (id) { sel[id] = true; });
  ACC = { ids: ids, names: picked.map(function (p) { return p.name; }), mode: start.mode, sel: sel, q: '', mixed: !same };
  drawAccess();
}
function drawAccess() {
  var m = DIRS[AS.dir], h = '', n = ACC.names.length;
  h += '<div class="info">Позиций: <b>' + n + '</b> — ' + esc(ACC.names.slice(0, 6).join(', ')) + (n > 6 ? ' и ещё ' + (n - 6) : '') + '</div>';
  if (ACC.mixed) h += '<div class="note" style="margin-top:12px">У отмеченных позиций сейчас разный доступ — будет задан один для всех.</div>';
  h += '<div class="chips" id="acc_mode" style="margin:16px 0 8px">' + ACC_MODES.map(function (x) {
    return '<button type="button" class="chip" data-m="' + x[0] + '" onclick="accMode(\'' + x[0] + '\')">' + x[1] + '</button>';
  }).join('') + '</div>';
  h += '<div class="s" id="acc_hint" style="margin:0 4px 12px"></div>';
  h += '<div id="acc_tools"></div><div id="acc_stores"></div>';
  h += '<div style="margin-top:18px"><button class="btn" onclick="askAccess()">Сохранить</button></div>';
  h += '<button class="btn ghost" onclick="drawAssort()">Назад к списку</button>';
  setHead('Доступ по точкам', m.t);
  view('<div style="grid-column:1/-1;max-width:720px">' + h + '</div>');
  accMode(ACC.mode);
}
function accMode(mode) {
  ACC.mode = mode;
  var chips = document.querySelectorAll('#acc_mode .chip');
  for (var i = 0; i < chips.length; i++) chips[i].className = 'chip' + (chips[i].getAttribute('data-m') === mode ? ' on' : '');
  var tools = document.getElementById('acc_tools');
  if (mode === 'all') { tools.innerHTML = ''; }
  else if (!document.getElementById('acc_q')) {
    tools.innerHTML = '<div class="atools astools"><input type="search" id="acc_q" class="atq" placeholder="Поиск точки" value="' + attr(ACC.q) + '"></div>' +
      '<div class="asbar" style="margin:0 0 12px"><button type="button" onclick="accAll(true)">Отметить найденные</button><button type="button" onclick="accAll(false)">Снять найденные</button></div>';
    var q = document.getElementById('acc_q');
    q.addEventListener('input', function () { ACC.q = q.value; fillAccess(); });
  }
  fillAccess();
}
function accStores() {
  var q = ACC.q.trim().toLowerCase();
  return AS.d.stores.filter(function (st) { return !q || st.label.toLowerCase().indexOf(q) >= 0; });
}
function accHint() {
  var cnt = Object.keys(ACC.sel).length, hint = document.getElementById('acc_hint');
  hint.textContent = ACC.mode === 'all' ? 'Позицию видят и могут заказать все точки направления.'
    : ACC.mode === 'only' ? 'Позицию видят и могут заказать ТОЛЬКО отмеченные точки (отмечено: ' + cnt + '). Остальные её не увидят.'
    : 'Позицию видят все точки, КРОМЕ отмеченных (отмечено: ' + cnt + ').';
}
function fillAccess() {
  var el = document.getElementById('acc_stores');
  accHint();
  if (ACC.mode === 'all') { el.innerHTML = ''; return; }
  var list = accStores();
  el.innerHTML = '<div class="card">' + (list.length ? list.map(function (st, i) {
    return '<label class="pick" style="display:flex"><input type="checkbox"' + (ACC.sel[st.id] ? ' checked' : '') + ' data-id="' + attr(st.id) + '" onchange="accToggle(this)">' +
      '<span class="grow"><span class="t">' + esc(st.label) + '</span></span></label>';
  }).join('') : '<div class="note">Ничего не найдено</div>') + '</div>';
}
function accToggle(cb) { var id = cb.getAttribute('data-id'); if (cb.checked) ACC.sel[id] = true; else delete ACC.sel[id]; accHint(); }
function accAll(on) { accStores().forEach(function (st) { if (on) ACC.sel[st.id] = true; else delete ACC.sel[st.id]; }); fillAccess(); }
function askAccess() {
  var k = AS.dir, m = DIRS[k], ids = ACC.mode === 'all' ? [] : Object.keys(ACC.sel);
  if (ACC.mode !== 'all' && !ids.length) return toast('Отметьте хотя бы одну точку');
  var labels = AS.d.stores.filter(function (st) { return ACC.sel[st.id]; }).map(function (st) { return st.label; });
  var who = ACC.mode === 'all' ? 'Доступ: всем точкам'
    : (ACC.mode === 'only' ? 'Только ' : 'Всем, кроме ') + labels.length + ' ТТ: ' + labels.slice(0, 6).join(', ') + (labels.length > 6 ? ' и ещё ' + (labels.length - 6) : '');
  confirmSheet({
    title: 'Изменить доступ?', sub: m.t, yes: 'Сохранить доступ',
    what: [ACC.names.length + ' позиций: ' + ACC.names.slice(0, 6).join(', ') + (ACC.names.length > 6 ? ' и ещё ' + (ACC.names.length - 6) : ''), who,
           'Продавцы увидят изменения в течение минуты; уже отправленные заказы не меняются', 'Действие попадёт в журнал'],
    run: function () { return call('assortAccess', { dir: k, ids: ACC.ids, mode: ACC.mode, stores: ids }); },
    done: function (res) {
      toast('Доступ изменён: ' + res.changed + ' поз.' + (res.skipped ? ' (' + res.skipped + ' уже было)' : ''));
      loadAssort(k, { f: AS.f, q: AS.q });
    }
  });
}

function previewAssort() {
  var ids = Object.keys(AS.sel);
  if (!ids.length) return toast('Отметьте позиции');
  var v = document.getElementById('as_val');
  if (v) AS.value = v.value;
  if (!String(AS.value).trim() || isNaN(asNum(AS.value))) return toast('Укажите число');
  spin('Считаю новые цены…');
  call('priceBulkPreview', { dir: AS.dir, ids: ids, mode: AS.mode, value: AS.value }).then(drawAssortPreview)
    .catch(function (e) { drawAssort(); toast(e && e.message ? e.message : String(e)); });
}

function drawAssortPreview(r) {
  var m = DIRS[AS.dir], h = '';
  h += '<div class="info">Изменение <b>' + esc(asChange(r.mode, r.value)) + '</b> · позиций: <b>' + r.n + '</b>' +
    (r.n ? '<br>Сумма цен: ' + esc(asMoney(r.sumOld)) + ' → <b>' + esc(asMoney(r.sumNew)) + '</b>' : '') + '</div>';
  if (r.skipped.length) h += '<div class="note" style="margin-top:12px">Пропущено без цены: ' +
    r.skipped.map(function (x) { return esc(x.name); }).join(', ') + '</div>';
  if (r.n) {
    h += '<div class="card" style="margin-top:16px"><div class="ashead"><span>Название</span><span>Было → Стало</span></div>' +
      r.rows.map(function (x) {
        var up = x.new > x.old;
        return '<div class="asrow"><span class="nm">' + esc(x.name) + '</span><span class="pr"><s>' + esc(asMoney(x.old)) + '</s> → <span class="' + (up ? 'up' : 'dn') + '">' + esc(asMoney(x.new)) + '</span></span></div>';
      }).join('') + '</div>';
    h += '<div style="margin-top:18px"><button class="btn" onclick="askAssortApply()">Сохранить</button></div>';
  } else {
    h += '<div class="note" style="margin-top:12px">Ни одна цена не изменится.</div>';
  }
  h += '<button class="btn ghost" onclick="drawAssort()">Назад к списку</button>';
  AS.prev = r;
  view('<div style="grid-column:1/-1;max-width:720px">' + h + '</div>');
}

function askAssortApply() {
  var r = AS.prev, k = AS.dir, m = DIRS[k];
  if (!r || !r.n) return;
  confirmSheet({
    title: 'Изменить цены?', sub: m.t, yes: 'Сохранить цены',
    what: [r.n + ' позиций: ' + asChange(r.mode, r.value) + ' (сумма цен ' + asMoney(r.sumOld) + ' → ' + asMoney(r.sumNew) + ')',
           'Продавцы увидят новые цены в течение минуты; уже отправленные заказы не меняются',
           'Действие попадёт в журнал'],
    run: function () { return call('priceBulkApply', { dir: k, mode: r.mode, value: r.value, rows: r.rows.map(function (x) { return { id: x.id, old: x.old }; }) }); },
    done: function (res) { toast('Цены обновлены: ' + res.changed + ' поз.'); loadAssort(k); }
  });
}

// ===== цены из приходов (BigQuery): incomingPreview / incomingApply (src/admin/incoming.js) =====
var INC = null;
function incWhen(iso) {
  try { return new Date(iso).toLocaleString('ru-RU', { timeZone: 'Europe/Kyiv', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}
function incDate(s) { var p = String(s || '').split('-'); return p.length === 3 ? p[2] + '.' + p[1] : ''; }

function incPreview() {
  var k = AS.dir;
  spin('Запрашиваю приходы…');
  call('incomingPreview', { dir: k }).then(function (r) {
    INC = { dir: k, r: r, sel: {} };
    r.rows.forEach(function (x) { if (!x.big) INC.sel[x.id] = true; });         // подозрительные (> 30%) не отмечены: только осознанно
    drawInc();
  }).catch(function (e) { drawAssort(); toast(e && e.message ? e.message : String(e)); });
}

function drawInc() {
  var r = INC.r, h = '';
  if (!r.n) {
    h += '<div class="ok">Все цены в прайсе совпадают с последними приходами.</div>';
    if (r.noIncoming) h += '<div class="s" style="margin:10px 4px 0">Без прихода за последние 45 дней: ' + r.noIncoming + ' поз. — их цена не меняется.</div>';
  } else {
    h += '<div class="info">Входящая цена изменилась у <b>' + r.n + '</b> поз. Отмечено: <b id="inc_cnt"></b><br>Данные приходов на ' + esc(incWhen(r.checkedAt)) + '</div>';
    if (r.big) h += '<div class="note" style="margin-top:12px">Изменение больше 30% у ' + r.big + ' поз. — не отмечены, проверьте накладную (акция или ошибка?) и отметьте вручную.</div>';
    if (r.noIncoming) h += '<div class="s" style="margin:10px 4px 0">Без прихода за 45 дней: ' + r.noIncoming + ' поз. — цена не меняется.</div>';
    h += '<div class="card" style="margin-top:16px"><div class="ashead"><span>Название · приход</span><span>Было → Стало</span></div>' +
      r.rows.map(function (x, i) {
        var up = x.new > x.old, pct = x.pct == null ? '' : (x.pct > 0 ? '+' : '') + x.pct + '%';
        return '<label class="pick" style="display:flex"><input type="checkbox"' + (INC.sel[x.id] ? ' checked' : '') + ' onchange="incToggle(' + i + ',this.checked)">' +
          '<span class="grow"><span class="t">' + esc(x.name) + (x.stop ? '<span class="asstop">стоп</span>' : '') + (x.big ? '<span class="asstop" style="background:var(--warn,#B3261E)">&gt;30%</span>' : '') + '</span>' +
          '<span class="s">приход ' + esc(incDate(x.docDate)) + ' · ' + esc(pct) + '</span></span>' +
          '<span class="right" style="white-space:nowrap"><s>' + esc(asMoney(x.old)) + '</s> → <b class="' + (up ? 'up' : 'dn') + '">' + esc(asMoney(x.new)) + '</b></span></label>';
      }).join('') + '</div>';
    h += '<div style="margin-top:18px"><button class="btn" onclick="askIncApply()">Применить выбранные</button></div>';
  }
  h += '<button class="btn ghost" onclick="loadAssort(INC.dir)">Назад к списку</button>';
  view('<div style="grid-column:1/-1;max-width:720px">' + h + '</div>');
  incCount();
}
function incToggle(i, on) { var x = INC.r.rows[i]; if (on) INC.sel[x.id] = true; else delete INC.sel[x.id]; incCount(); }
function incCount() { var c = document.getElementById('inc_cnt'); if (c) c.textContent = Object.keys(INC.sel).length + ' из ' + INC.r.n; }

function askIncApply() {
  var k = INC.dir, m = DIRS[k], rows = INC.r.rows.filter(function (x) { return INC.sel[x.id]; });
  if (!rows.length) return toast('Отметьте позиции');
  var so = 0, sn = 0;
  rows.forEach(function (x) { so += x.old; sn += x.new; });
  confirmSheet({
    title: 'Подтянуть цены из приходов?', sub: m.t, yes: 'Применить цены',
    what: [rows.length + ' позиций (сумма цен ' + asMoney(so) + ' → ' + asMoney(sn) + ')',
           'Сервер ещё раз сверит цены с приходами; если что-то изменилось — ничего не запишет',
           'Продавцы увидят новые цены в течение минуты; уже отправленные заказы не меняются',
           'Действие попадёт в журнал'],
    run: function () { return call('incomingApply', { dir: k, rows: rows.map(function (x) { return { id: x.id, old: x.old, new: x.new }; }) }); },
    done: function (res) { toast('Цены обновлены: ' + res.changed + ' поз.'); loadAssort(k); }
  });
}

// ===== новые позиции из прайса (ещё не в ассортименте): vegNewPreview / vegNewApply (src/admin/vegNew.js) =====
var VN = null;
function vnPreview() {
  var k = AS.dir;
  spin('Читаю прайс поставщика…');
  call('vegNewPreview', { dir: k }).then(function (r) {
    VN = { dir: k, r: r, sel: {} };
    r.rows.forEach(function (x) { VN.sel[x.name] = true; });
    drawVn();
  }).catch(function (e) { drawAssort(); toast(e && e.message ? e.message : String(e)); });
}
function drawVn() {
  var r = VN.r, h = '';
  if (!r.n) {
    h += '<div class="ok">В прайсе новых позиций нет — всё, что там есть, уже в ассортименте.</div>';
  } else {
    h += '<div class="info">В прайсе найдено новых позиций: <b>' + r.n + '</b>. Отмечено: <b id="vn_cnt"></b></div>';
    h += '<div class="card" style="margin-top:16px">' + r.rows.map(function (x, i) {
      return '<label class="pick" style="display:flex"><input type="checkbox"' + (VN.sel[x.name] ? ' checked' : '') + ' onchange="vnToggle(' + i + ',this.checked)">' +
        '<span class="grow"><span class="t">' + esc(x.name) + '</span></span>' +
        '<span class="right" style="white-space:nowrap">' + esc(asMoney(x.price)) + '</span></label>';
    }).join('') + '</div>';
    h += '<div style="margin-top:18px"><button class="btn" onclick="askVnApply()">Добавить отмеченные (на стопе)</button></div>';
  }
  h += '<button class="btn ghost" onclick="loadAssort(VN.dir)">Назад к списку</button>';
  view('<div style="grid-column:1/-1;max-width:720px">' + h + '</div>');
  vnCount();
}
function vnToggle(i, on) { var x = VN.r.rows[i]; if (on) VN.sel[x.name] = true; else delete VN.sel[x.name]; vnCount(); }
function vnCount() { var c = document.getElementById('vn_cnt'); if (c) c.textContent = Object.keys(VN.sel).length + ' из ' + VN.r.n; }
function askVnApply() {
  var k = VN.dir, m = DIRS[k], names = Object.keys(VN.sel);
  if (!names.length) return toast('Отметьте позиции');
  confirmSheet({
    title: 'Добавить новые позиции?', sub: m.t, yes: 'Добавить (на стопе)',
    what: [names.length + ' позиций: ' + names.slice(0, 6).join(', ') + (names.length > 6 ? ' и ещё ' + (names.length - 6) : ''),
           'Позиции появятся в ассортименте со статусом «стоп» — продавцы их не увидят, пока вы сами не снимете стоп',
           'Действие попадёт в журнал'],
    run: function () { return call('vegNewApply', { dir: k, names: names }); },
    done: function (res) { toast('Добавлено: ' + res.added + ' поз. (на стопе)'); loadAssort(k); }
  });
}

// экран assort - в общий диспетчер load()
var loadBaseAs_ = load;
load = function () {
  if (S.screen === 'assort') return loadAssort(S.dir);
  return loadBaseAs_();
};
</script>
