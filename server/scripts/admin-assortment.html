<!-- Экран «Ассортимент и цены» направления (направление -> Управление приёмом): список позиций, поиск, выбор галочками, массовая смена цен
     на % или на сумму, перегляд «Было -> Стало» перед сохранением, подтверждение. Действия assortment / priceBulkPreview / priceBulkApply (src/admin/assortment.js).
     Овощи: цены приходят из прайса поставщика сами - только просмотр (priceLocked). Вставляется в конец страницы скриптом build-admin.js после admin-deadline.html;
     app/ui не меняется (пункт меню вставляет build-admin.js). Тексты - по-русски, как весь пульт. -->
<style>
.asbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.asbar button{flex:1 1 150px;padding:12px 10px;border:1px solid var(--ln,#DCE0E5);border-radius:14px;background:var(--sf,#fff);color:var(--tx,#16181D);font:inherit;font-weight:600;cursor:pointer}
.ascnt{margin:14px 4px 0;font-size:14px;font-weight:600}
.asrow{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln,#DCE0E5)}
.asrow:last-child{border-bottom:0}
.asrow .nm{flex:1;min-width:0;font-size:15px;line-height:1.35}
.asrow .pr{flex:none;white-space:nowrap;font-weight:600}
.asrow .pr s{opacity:.55;font-weight:400}
.asrow .up{color:#B3261E}.asrow .dn{color:#166B3A}
.asstop{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#7A828E;color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
.ashead{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;border-bottom:1px solid var(--ln,#DCE0E5)}
.asstopb{border-color:var(--warn)!important;color:var(--warn)!important}
.astools{margin:12px 0}
@media (max-width:520px){.astools input[type=search]{max-width:none;flex-basis:100%}}
.asprice{margin-top:16px;border-top:1px solid var(--ln,#DCE0E5)}
.asprice summary{cursor:pointer;font-weight:700;padding:14px 4px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.asprice summary::-webkit-details-marker{display:none}
.asprice summary::after{content:"▾";opacity:.6;transition:transform .15s}
.asprice[open] summary::after{transform:rotate(180deg)}
</style>
<script>
// ===== shop-orders: ассортимент и цены =====
var AS = { dir: '', d: null, q: '', f: 'all', sel: {}, mode: 'pct', value: '' };

function asMoney(n) { return (Math.round(Number(n) * 100) / 100).toFixed(2); }
function asNum(s) { return Number(String(s == null ? '' : s).trim().replace(',', '.')); }
function asChange(mode, value) {
  var v = asNum(value);
  return mode === 'pct' ? (v > 0 ? '+' : '') + v + '%' : (v > 0 ? '+' : '') + v + ' грн';
}

function loadAssort(k, keep) {
  var m = DIRS[k];
  setHead('Ассортимент', m.t);
  spin();
  call('assortment', { dir: k }).then(function (d) {
    AS = { dir: k, d: d, q: keep ? keep.q : '', f: keep ? keep.f : 'all', sel: {}, mode: 'pct', value: '' };
    drawAssort();
  }).catch(fail);
}

// индексы позиций после фильтра (все / активные / на стопе) и поиска
function asFiltered() {
  var q = AS.q.trim().toLowerCase(), out = [];
  AS.d.products.forEach(function (p, i) {
    if (AS.f === 'active' && p.stop) return;
    if (AS.f === 'stop' && !p.stop) return;
    if (!q || (p.name + ' ' + p.barcode).toLowerCase().indexOf(q) >= 0) out.push(i);
  });
  return out;
}

function asFilter(f) { AS.f = f; fillAssortList(); }

function drawAssort() {
  var d = AS.d, h = '';
  if (d.priceLocked) h += '<div class="note">' + esc(d.lockedReason) + '. Цены здесь только смотреть; ставить позиции на стоп можно.</div>';
  else if (d.hidePrice) h += '<div class="note">Продавцы этого направления цен не видят, но цены используются в расчётах.</div>';
  h += '<div class="atools astools"><input type="search" id="as_q" class="atq" placeholder="Поиск по названию или штрихкоду" value="' + attr(AS.q) + '">' +
    '<span id="as_chips" style="display:contents"></span></div>';
  h += '<div class="card" style="padding:16px">' +
    '<div class="ascnt" id="as_cnt" style="margin:0 4px 10px"></div>' +
    '<div class="asbar" style="margin-top:0">' +
      '<button type="button" onclick="asSelectFound()">Выбрать все найденные</button>' +
      '<button type="button" onclick="asClear()">Снять выбор</button>' +
    '</div>' +
    '<div class="asbar">' +
      '<button type="button" class="asstopb" onclick="askAssortStop(true)">Поставить на стоп</button>' +
      '<button type="button" onclick="askAssortStop(false)">Снять со стопа</button>' +
    '</div>';
  if (!d.priceLocked) {
    // на ноутбуке блок цен открыт сразу; на телефоне свёрнут (чтобы список был рядом), если там уже не вписано значение
    h += '<details class="asprice"' + (window.innerWidth > 700 || String(AS.value).trim() ? ' open' : '') + '><summary>Изменить цены у отмеченных позиций</summary>' +
      '<div class="chips" id="as_mode" style="margin:12px 0 12px">' +
        '<button type="button" class="chip" data-m="pct" onclick="asMode(\'pct\')">На %</button>' +
        '<button type="button" class="chip" data-m="sum" onclick="asMode(\'sum\')">На сумму</button>' +
      '</div>' +
      '<div class="s" id="as_lbl" style="margin:0 4px 8px"></div>' +
      '<input type="text" id="as_val" inputmode="decimal" autocomplete="off" placeholder="Например 5 или -3,5" value="' + attr(AS.value) + '">' +
      '<div style="margin-top:14px"><button class="btn" onclick="previewAssort()">Посмотреть изменения</button></div></details>';
  }
  h += '</div><div id="as_list" style="margin-top:18px"></div>';
  view(h);
  var q = document.getElementById('as_q');
  q.addEventListener('input', function () { AS.q = q.value; fillAssortList(); });
  var v = document.getElementById('as_val');
  if (v) v.addEventListener('input', function () { AS.value = v.value; });
  asMode(AS.mode);
  fillAssortList();
}

function asMode(m) {
  AS.mode = m;
  var chips = document.querySelectorAll('#as_mode .chip');
  for (var i = 0; i < chips.length; i++) chips[i].className = 'chip' + (chips[i].getAttribute('data-m') === m ? ' on' : '');
  var l = document.getElementById('as_lbl');
  if (l) l.textContent = m === 'pct' ? 'На сколько процентов (минус — снизить)' : 'На сколько гривен (минус — снизить)';
}

function fillAssortList() {
  var el = document.getElementById('as_list');
  if (!el) return;
  var d = AS.d, idx = asFiltered();
  var nStop = d.products.filter(function (p) { return p.stop; }).length;
  var defs = [['all', 'Все', d.products.length], ['active', 'Активные', d.products.length - nStop], ['stop', 'На стопе', nStop]];
  document.getElementById('as_chips').innerHTML = defs.map(function (x) {
    return '<button type="button" class="achip' + (AS.f === x[0] ? ' on' : '') + '" onclick="asFilter(\'' + x[0] + '\')">' + x[1] + '<i>' + x[2] + '</i></button>';
  }).join('');
  if (!idx.length) {
    var nothing = AS.f === 'stop' && !AS.q.trim();
    el.innerHTML = '<div class="' + (nothing ? 'ok' : 'note') + '">' + (nothing ? 'Сейчас на стопе ничего нет' : 'Ничего не найдено') + '</div>';
    asCount(); return;
  }
  var rows = idx.map(function (i) {
    var p = d.products[i];
    var price = esc(asMoney(p.price)) + (d.markup !== 1 ? ' <s>продавцу ' + esc(asMoney(p.sellerPrice)) + '</s>' : '');
    var sub = (p.barcode ? esc(p.barcode) : '') + (p.category ? (p.barcode ? ' · ' : '') + esc(p.category) : '');
    var name = esc(p.name) + (p.stop ? '<span class="asstop">стоп</span>' : '');
    return '<label class="pick" style="display:flex"><input type="checkbox"' + (AS.sel[p.id] ? ' checked' : '') + ' onchange="asToggle(' + i + ',this.checked)">' +
      '<span class="grow"><span class="t">' + name + '</span>' + (sub ? '<span class="s">' + sub + '</span>' : '') + '</span>' +
      '<span class="right" style="white-space:nowrap">' + price + '</span></label>';
  }).join('');
  el.innerHTML = '<div class="card">' + rows + '</div>';
  asCount();
}

// «Поставить на стоп» / «Снять со стопа» для отмеченных (assortStop): позиции, уже в нужном состоянии, сервер пропускает
function askAssortStop(stop) {
  var k = AS.dir, m = DIRS[k], ids = Object.keys(AS.sel), names = [];
  if (!ids.length) return toast('Отметьте позиции');
  AS.d.products.forEach(function (p) { if (AS.sel[p.id]) names.push(p.name); });
  confirmSheet({
    title: stop ? 'Поставить на стоп?' : 'Снять со стопа?', sub: m.t, yes: stop ? 'Поставить на стоп' : 'Снять со стопа',
    what: [names.length + ' позиций: ' + names.slice(0, 6).join(', ') + (names.length > 6 ? ' и ещё ' + (names.length - 6) : ''),
           stop ? 'Продавцы перестанут видеть эти позиции в течение минуты; уже отправленные заказы не меняются' : 'Продавцы снова увидят эти позиции в течение минуты',
           'Действие попадёт в журнал'],
    run: function () { return call('assortStop', { dir: k, ids: ids, stop: stop }); },
    done: function (res) {
      toast((stop ? 'На стопе: ' : 'Стоп снят: ') + res.changed + ' поз.' + (res.skipped ? ' (' + res.skipped + ' уже было)' : ''));
      loadAssort(k, { f: AS.f, q: AS.q });                          // свежий список, фильтр и поиск остаются
    }
  });
}

function asToggle(i, on) {
  var p = AS.d.products[i];
  if (on) AS.sel[p.id] = true; else delete AS.sel[p.id];
  asCount();
}
function asSelectFound() {
  asFiltered().forEach(function (i) { AS.sel[AS.d.products[i].id] = true; });
  fillAssortList();
}
function asClear() { AS.sel = {}; fillAssortList(); }
function asCount() {
  var c = document.getElementById('as_cnt');
  if (c) c.textContent = 'Отмечено: ' + Object.keys(AS.sel).length + ' из ' + AS.d.products.length;
}

function previewAssort() {
  var ids = Object.keys(AS.sel);
  if (!ids.length) return toast('Отметьте позиции');
  var v = document.getElementById('as_val');
  if (v) AS.value = v.value;
  if (!String(AS.value).trim() || isNaN(asNum(AS.value))) return toast('Укажите число');
  spin('Считаю новые цены…');
  call('priceBulkPreview', { dir: AS.dir, ids: ids, mode: AS.mode, value: AS.value }).then(drawAssortPreview)
    .catch(function (e) { drawAssort(); toast(e && e.message ? e.message : String(e)); });
}

function drawAssortPreview(r) {
  var m = DIRS[AS.dir], h = '';
  h += '<div class="info">Изменение <b>' + esc(asChange(r.mode, r.value)) + '</b> · позиций: <b>' + r.n + '</b>' +
    (r.n ? '<br>Сумма цен: ' + esc(asMoney(r.sumOld)) + ' → <b>' + esc(asMoney(r.sumNew)) + '</b>' : '') + '</div>';
  if (r.skipped.length) h += '<div class="note" style="margin-top:12px">Пропущено без цены: ' +
    r.skipped.map(function (x) { return esc(x.name); }).join(', ') + '</div>';
  if (r.n) {
    h += '<div class="card" style="margin-top:16px"><div class="ashead"><span>Название</span><span>Было → Стало</span></div>' +
      r.rows.map(function (x) {
        var up = x.new > x.old;
        return '<div class="asrow"><span class="nm">' + esc(x.name) + '</span><span class="pr"><s>' + esc(asMoney(x.old)) + '</s> → <span class="' + (up ? 'up' : 'dn') + '">' + esc(asMoney(x.new)) + '</span></span></div>';
      }).join('') + '</div>';
    h += '<div style="margin-top:18px"><button class="btn" onclick="askAssortApply()">Сохранить</button></div>';
  } else {
    h += '<div class="note" style="margin-top:12px">Ни одна цена не изменится.</div>';
  }
  h += '<button class="btn ghost" onclick="drawAssort()">Назад к списку</button>';
  AS.prev = r;
  view('<div style="grid-column:1/-1;max-width:720px">' + h + '</div>');
}

function askAssortApply() {
  var r = AS.prev, k = AS.dir, m = DIRS[k];
  if (!r || !r.n) return;
  confirmSheet({
    title: 'Изменить цены?', sub: m.t, yes: 'Сохранить цены',
    what: [r.n + ' позиций: ' + asChange(r.mode, r.value) + ' (сумма цен ' + asMoney(r.sumOld) + ' → ' + asMoney(r.sumNew) + ')',
           'Продавцы увидят новые цены в течение минуты; уже отправленные заказы не меняются',
           'Действие попадёт в журнал'],
    run: function () { return call('priceBulkApply', { dir: k, mode: r.mode, value: r.value, rows: r.rows.map(function (x) { return { id: x.id, old: x.old }; }) }); },
    done: function (res) { toast('Цены обновлены: ' + res.changed + ' поз.'); loadAssort(k); }
  });
}

// экран assort - в общий диспетчер load()
var loadBaseAs_ = load;
load = function () {
  if (S.screen === 'assort') return loadAssort(S.dir);
  return loadBaseAs_();
};
</script>
