<script>
var TOKEN = '';
try { TOKEN = localStorage.getItem('adm_token') || ''; } catch (e) {}

var S = { screen: 'today', dir: '', store: null, data: null, busy: false };

var DIRS = {
  bakery: { t: 'Выпечка и кулинария', s: 'В', c: '#E65100' },
  bread:  { t: 'Хлеб Рома',           s: 'Р', c: '#8D6E63' },
  nbhz:   { t: 'Хлеб НБХЗ',           s: 'Н', c: '#5D4037' },
  veg:    { t: 'Овощи и фрукты',      s: 'О', c: '#2E7D32' }
};
var ORDER = ['bakery', 'bread', 'nbhz', 'veg'];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function call(action, payload) {
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return res(r.data);
        if (r && r.error === 'AUTH') { logout(); return rej(new Error('Нужно войти заново')); }
        rej(new Error((r && r.error) || 'Ошибка'));
      })
      .withFailureHandler(function (e) { rej(e); })
      .adminApi(action, payload || {}, TOKEN);
  });
}

function logout() {
  TOKEN = '';
  try { localStorage.removeItem('adm_token'); } catch (e) {}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}

function doLogin() {
  var pin = document.getElementById('pin').value;
  var err = document.getElementById('pinerr');
  err.textContent = '';
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.ok) { err.textContent = (r && r.error) || 'Ошибка'; return; }
      TOKEN = r.data.token;
      try { localStorage.setItem('adm_token', TOKEN); } catch (e) {}
      start();
    })
    .withFailureHandler(function (e) { err.textContent = String(e.message || e); })
    .adminApi('login', { pin: pin }, '');
}

document.getElementById('pin').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doLogin();
});

function start() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  go('today');
}

function setHead(title, sub, back) {
  document.getElementById('title').textContent = title;
  document.getElementById('subtitle').textContent = sub || '';
  document.getElementById('back').style.display = back ? 'flex' : 'none';
}

function tabs(name) {
  ['today', 'stores', 'restore', 'log'].forEach(function (k) {
    var el = document.getElementById('t-' + k);
    if (el) el.className = 'tab' + (k === name ? ' on' : '');
  });
}

function view(html) { document.getElementById('view').innerHTML = html; }
function spin(text) { view('<div class="spin">' + esc(text || 'Загрузка…') + '</div>'); }

function fail(e) {
  view('<div class="bad">' + esc(e && e.message ? e.message : e) + '</div>');
}

function go(screen, arg) {
  S.screen = screen;
  if (screen === 'today' || screen === 'stores' || screen === 'restore' || screen === 'log') tabs(screen);
  load(arg);
}
</script>
<script>
function load(arg) {
  if (S.screen === 'today') return loadToday();
  if (S.screen === 'stores') return loadStores(typeof arg === 'string' ? arg : '');
  if (S.screen === 'store') return loadStore(S.store, S.dir);
  if (S.screen === 'restore') return loadRestore(S.dir || 'bakery');
  if (S.screen === 'dir') return loadDir(S.dir);
  if (S.screen === 'log') return loadLog();
}

function goBack() {
  if (S.screen === 'store') return go('stores');
  if (S.screen === 'dir') return go('today');
  go('today');
}

// ================= СЕГОДНЯ =================
function loadToday() {
  setHead('Сегодня', '', false);
  spin();
  call('today').then(function (d) {
    S.data = d;
    setHead('Сегодня', d.today + ' · ' + d.time, false);
    var h = '';

    var alerts = d.dirs.filter(function (x) {
      return !x.closed && x.minLeft !== null && x.minLeft > 0 && x.minLeft <= 60 && x.waiting.length;
    });
    if (alerts.length) {
      h += '<div class="note">' + alerts.map(function (x) {
        return 'Дедлайн «' + esc(DIRS[x.key].t) + '» через <b>' + x.minLeft +
               ' мин</b>. Не заказали ' + x.waiting.length + ' точек.';
      }).join('<br>') + '</div>';
    }

    h += '<div><div class="sec">Направления</div>';
    ORDER.forEach(function (k) {
      var x = null;
      d.dirs.forEach(function (y) { if (y.key === k) x = y; });
      if (!x) return;
      var meta = DIRS[k];
      var pill = x.openedAll ? '<span class="pill warn">Открыто всем</span>'
               : (x.closed ? '<span class="pill closed">Закрыто</span>'
                           : '<span class="pill open">Открыто</span>');
      var pct = x.total ? Math.round(x.ordered / x.total * 100) : 0;
      h += '<button class="dir" onclick="openDir(\'' + k + '\')">' +
             '<div class="dirtop">' +
               '<span class="sq" style="background:' + meta.c + '">' + meta.s + '</span>' +
               '<span class="grow"><span class="nm">' + esc(meta.t) + '</span>' +
               '<span class="mut">дедлайн ' + esc(x.deadline || '—') +
                 (x.reportAt ? ' · отчёт в ' + esc(x.reportAt) : '') + '</span></span>' +
               pill +
             '</div>' +
             '<div style="display:flex;align-items:center;gap:10px;margin-top:12px">' +
               '<span class="bar"><i style="width:' + pct + '%;background:' + meta.c + '"></i></span>' +
               '<span style="font-size:13px;font-weight:600">' + x.ordered + ' из ' + x.total + '</span>' +
             '</div></button>';
    });
    h += '</div>';

    h += '<div><div class="sec">Быстрые действия</div>' +
         '<div class="card">' +
           '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="go(\'stores\')">' +
             '<span class="grow"><span class="nm">Заказы точки</span>' +
             '<span class="mut">посмотреть, отменить, снять метку, открыть приём</span></span></button>' +
           '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="go(\'restore\')">' +
             '<span class="grow"><span class="nm">Восстановить из бэкапа</span>' +
             '<span class="mut">вернуть строки, которых нет в рабочем листе</span></span></button>' +
         '</div></div>';

    view(h);
  }).catch(fail);
}

function openDir(k) { S.dir = k; go('dir'); }

// ================= НАПРАВЛЕНИЕ =================
function loadDir(k) {
  var meta = DIRS[k];
  setHead(meta.t, '', true);
  spin();
  call('today').then(function (d) {
    var x = null;
    d.dirs.forEach(function (y) { if (y.key === k) x = y; });
    if (!x) return fail(new Error('Направление не найдено'));

    var h = '<div class="card pad">' +
      '<div style="font-size:15px;line-height:1.5">' +
        'Дедлайн <b>' + esc(x.deadline || '—') + '</b>, сейчас ' + esc(d.time) + '.<br>' +
        'Заказали <b>' + x.ordered + '</b> из <b>' + x.total + '</b> точек' +
        (x.reportAt ? ', отчёт собран в ' + esc(x.reportAt) : '') + '.' +
        (x.openedAll ? '<br>Приём открыт всем до конца дня.' : '') +
      '</div></div>';

    h += '<div class="card">' +
      (x.openedAll
        ? '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="askCloseAll(\'' + k + '\')">' +
            '<span class="grow"><span class="nm">Вернуть обычный режим</span>' +
            '<span class="mut">дедлайн снова действует</span></span></button>'
        : '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="askOpenAll(\'' + k + '\')">' +
            '<span class="grow"><span class="nm">Открыть приём всем до конца дня</span>' +
            '<span class="mut">дедлайн ' + esc(x.deadline || '—') + ' сегодня не действует</span></span></button>') +
      '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="S.dir=\'' + k + '\';go(\'restore\')">' +
        '<span class="grow"><span class="nm">Проверить бэкап</span>' +
        '<span class="mut">сравнить с рабочим листом</span></span></button>' +
      '</div>';

    if (x.waiting.length) {
      h += '<div><div class="sec">Ещё не заказали (' + x.waiting.length + ')</div><div class="card">' +
        x.waiting.map(function (label) {
          return '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="findStore(' +
            JSON.stringify(label).replace(/"/g, '&quot;') + ',\'' + k + '\')">' +
            '<span class="grow"><span style="font-size:15px">' + esc(label) + '</span></span>' +
            '<span class="mut">открыть</span></button>';
        }).join('') + '</div></div>';
    } else {
      h += '<div class="ok">Заказали все точки этого направления.</div>';
    }
    view(h);
  }).catch(fail);
}
</script>
<script>
// ================= ТОЧКИ =================
function loadStores(q) {
  setHead('Точки', '', false);
  var html = '<input id="q" type="search" placeholder="Адрес, название или номер точки" value="' + esc(q || '') + '">' +
             '<div id="list"><div class="spin">Загрузка…</div></div>';
  view(html);
  var inp = document.getElementById('q');
  inp.addEventListener('input', function () {
    clearTimeout(S.t);
    S.t = setTimeout(function () { fillStores(inp.value); }, 250);
  });
  fillStores(q || '');
}

function fillStores(q) {
  call('stores', { q: q, dir: S.dir || '' }).then(function (list) {
    var el = document.getElementById('list');
    if (!el) return;
    if (!list.length) { el.innerHTML = '<div class="note">Ничего не найдено</div>'; return; }
    el.innerHTML = '<div class="card">' + list.map(function (s) {
      var dots = s.directions.map(function (k) {
        return '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' +
               (DIRS[k] ? DIRS[k].c : '#ccc') + ';margin-right:4px"></span>';
      }).join('');
      return '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="openStore(\'' +
        esc(s.id) + '\')"><span class="grow"><span class="nm">' + esc(s.label) + '</span>' +
        '<span class="mut">' + dots + (s.code ? '№ ' + esc(s.code) : '') +
        (s.route ? ' · маршрут ' + esc(s.route) : '') + '</span></span></button>';
    }).join('') + '</div>';
  }).catch(fail);
}

function findStore(label, dir) {
  S.dir = dir || '';
  call('stores', { q: label, dir: dir || '' }).then(function (list) {
    if (!list.length) return fail(new Error('Точка не найдена'));
    openStore(list[0].id);
  }).catch(fail);
}

function openStore(id) { S.store = id; S.screen = 'store'; loadStore(id, S.dir); }

function loadStore(id, dir) {
  setHead('Точка', '', true);
  spin();
  call('store', { storeId: id, dir: dir || '' }).then(function (d) {
    S.dir = d.dir;
    setHead(d.label, (d.code ? '№ ' + d.code : '') + (d.route ? ' · маршрут ' + d.route : ''), true);

    var h = '<div class="chips">' + d.directions.map(function (k) {
      return '<button class="chip' + (k === d.dir ? ' on' : '') + '" onclick="S.dir=\'' + k +
             '\';loadStore(\'' + esc(d.id) + '\',\'' + k + '\')">' + esc(DIRS[k] ? DIRS[k].t : k) + '</button>';
    }).join('') + '</div>';

    if (!d.dayOk) h += '<div class="note">Сегодня не день приёма по этому направлению.</div>';

    if (d.rows.length) {
      h += '<div class="card">' +
        '<div class="row"><span class="grow nm">Заказ на ' + esc(S.data && S.data.today || '') + '</span>' +
        '<span class="pill open">Есть</span></div>' +
        d.rows.map(function (r) {
          return '<div class="row"><span class="grow" style="font-size:15px">' + esc(r.name) +
                 '</span><span style="font-size:15px;font-weight:600">' + r.qty + '</span></div>';
        }).join('') +
        '<div class="row" style="background:#FAFBFC"><span class="grow mut">' + d.rows.length +
        ' позиций · ' + d.qty + ' ' + esc(d.unit) + ' · лист «' + esc(d.sheet) + '»' +
        (d.firstRow ? ', с ' + d.firstRow + '-й строки' : '') + '</span></div></div>';
    } else {
      h += '<div class="card pad"><div style="font-size:15px">Сегодня заказа нет.' +
           (d.marked ? ' Но метка «уже заказывали» стоит — значит строки потерялись.' : '') + '</div></div>';
    }

    if (d.lateLeft) h += '<div class="ok">Приём открыт ещё ' + d.lateLeft + ' мин.</div>';

    h += '<div><div class="sec">Действия</div><div class="card">';
    if (d.rows.length) h += actRow('Отменить заказ', 'убрать строки и метку — точка закажет заново',
      'askCancel(\'' + esc(d.id) + '\',\'' + d.dir + '\',' + d.rows.length + ')');
    if (d.marked) h += actRow('Снять метку «уже заказывали»', 'строки остаются на месте',
      'askClearMark(\'' + esc(d.id) + '\',\'' + d.dir + '\')');
    h += actRow('Открыть приём этой точке', 'на 30 минут, даже после дедлайна',
      'askOpenStore(\'' + esc(d.id) + '\',\'' + d.dir + '\')');
    h += '</div></div>';

    view(h);
  }).catch(fail);
}

function actRow(title, sub, onclick) {
  return '<button class="row" style="width:100%;border:0;background:#fff;text-align:left;cursor:pointer" onclick="' +
    onclick + '"><span class="grow"><span class="nm">' + esc(title) + '</span><span class="mut">' +
    esc(sub) + '</span></span></button>';
}
</script>
<script>
// ================= ПОДТВЕРЖДЕНИЕ =================
function confirmSheet(opts) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">' +
    '<div class="grip"></div><h2>' + esc(opts.title) + '</h2>' +
    '<div style="font-size:15px;line-height:1.45;color:#5A626D">' + esc(opts.sub || '') + '</div>' +
    '<div class="what">' + opts.what.map(function (t) { return '• ' + esc(t); }).join('<br>') + '</div>' +
    '<button class="btn" id="yes">' + esc(opts.yes || 'Подтвердить') + '</button>' +
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Отмена</button>' +
    '</div></div>';
  document.getElementById('yes').onclick = function () {
    var b = this;
    if (S.busy) return;
    S.busy = true;
    b.disabled = true;
    b.textContent = 'Выполняю…';
    opts.run().then(function (res) {
      S.busy = false;
      closeSheet();
      if (opts.done) opts.done(res);
    }).catch(function (e) {
      S.busy = false;
      b.disabled = false;
      b.textContent = esc(opts.yes || 'Подтвердить');
      alert(e && e.message ? e.message : e);
    });
  };
}

function closeSheet() { document.getElementById('modal').innerHTML = ''; }

function askCancel(id, dir, n) {
  confirmSheet({
    title: 'Отменить заказ?',
    sub: DIRS[dir].t,
    what: ['Из рабочего листа удалятся ' + n + ' строк сегодняшнего заказа',
           'Снимется метка «уже заказывали» — точка сможет заказать заново',
           'Запись в «Журнал дій»'],
    yes: 'Да, отменить',
    run: function () { return call('cancelOrder', { storeId: id, dir: dir }); },
    done: function (r) { toast('Удалено строк: ' + r.removed); loadStore(id, dir); }
  });
}

function askClearMark(id, dir) {
  confirmSheet({
    title: 'Снять метку?',
    sub: DIRS[dir].t,
    what: ['Строки в листе остаются как есть',
           'Точка сможет отправить заказ ещё раз',
           'Запись в «Журнал дій»'],
    yes: 'Снять метку',
    run: function () { return call('clearMark', { storeId: id, dir: dir }); },
    done: function () { toast('Метка снята'); loadStore(id, dir); }
  });
}

function askOpenStore(id, dir) {
  confirmSheet({
    title: 'Открыть приём точке?',
    sub: DIRS[dir].t,
    what: ['Точка сможет отправить заказ ближайшие 30 минут',
           'На остальные точки это не влияет',
           'Метку «уже заказывали» не трогаем — дубля не будет'],
    yes: 'Открыть на 30 минут',
    run: function () { return call('openStore', { storeId: id, dir: dir }); },
    done: function (r) { toast('Открыто на ' + (r.left || 30) + ' мин'); loadStore(id, dir); }
  });
}

function askOpenAll(dir) {
  confirmSheet({
    title: 'Открыть всем до конца дня?',
    sub: DIRS[dir].t,
    what: ['Дедлайн сегодня не действует ни для одной точки',
           'Те, кто уже заказал, останутся заблокированы — дублей не будет',
           'Вернуть режим можно этой же кнопкой'],
    yes: 'Открыть всем',
    run: function () { return call('openAll', { dir: dir }); },
    done: function () { toast('Открыто до конца дня'); loadDir(dir); }
  });
}

function askCloseAll(dir) {
  confirmSheet({
    title: 'Вернуть обычный режим?',
    sub: DIRS[dir].t,
    what: ['Дедлайн ' + DIRS[dir].t + ' снова действует',
           'Заказы, которые уже приняты, остаются'],
    yes: 'Вернуть',
    run: function () { return call('closeAll', { dir: dir }); },
    done: function () { toast('Обычный режим'); loadDir(dir); }
  });
}

function toast(text) {
  var m = document.getElementById('modal');
  m.innerHTML = '<div style="position:fixed;left:16px;right:16px;bottom:96px;z-index:60;background:#16181D;color:#fff;' +
    'border-radius:14px;padding:14px 16px;font-size:15px;text-align:center;max-width:488px;margin:0 auto">' +
    esc(text) + '</div>';
  setTimeout(function () { m.innerHTML = ''; }, 2600);
}
</script>
<script>
// ================= БЭКАП =================
function loadRestore(dir) {
  S.dir = dir;
  setHead('Бэкап', '', false);
  var chips = '<div class="chips">' + ORDER.map(function (k) {
    return '<button class="chip' + (k === dir ? ' on' : '') + '" onclick="loadRestore(\'' + k + '\')">' +
           esc(DIRS[k].t.split(' ')[0]) + '</button>';
  }).join('') + '</div>';
  view(chips + '<div id="res"><div class="spin">Сравниваю бэкап с рабочим листом…</div></div>');

  call('restoreScan', { dir: dir }).then(function (d) {
    var el = document.getElementById('res');
    if (!el) return;
    S.scan = d;
    var h = '<div class="card pad"><div style="font-size:15px;line-height:1.5">' +
      esc(d.dirTitle) + ', ' + esc(d.date) + '<br>' +
      'В бэкапе <b>' + d.backupRows + '</b> строк, в рабочем листе <b>' + d.liveRows + '</b>.' +
      '</div></div>';

    if (!d.stores.length) {
      h += '<div class="ok">Всё на месте — пропавших строк нет.</div>';
      el.innerHTML = h;
      return;
    }

    h += '<div class="bad">Не хватает <b>' + d.missingRows + '</b> строк от ' + d.stores.length +
         ' точек. Отметьте, что вернуть.</div>';

    h += '<div><div class="sec">Что вернуть</div><div class="card">' + d.stores.map(function (s, i) {
      return '<label class="pick"><input type="checkbox" checked data-key="' + esc(s.key) + '">' +
        '<span class="grow"><span class="nm">' + esc(s.label) + '</span><span class="mut">' +
        s.missing + ' строк · ' + s.qty + ' ' + esc(d.unit) + ' · снимок ' + esc(s.stamp) + '</span></span>' +
        '<span class="mut" onclick="event.preventDefault();toggleItems(' + i + ')" style="cursor:pointer">что именно</span>' +
        '</label><div id="it' + i + '" style="display:none;padding:0 15px 12px 49px">' +
        s.items.map(function (it) {
          return '<div style="display:flex;gap:10px;font-size:14px;padding:3px 0"><span class="grow">' +
                 esc(it.name) + '</span><span style="font-weight:600">' + it.qty + '</span></div>';
        }).join('') + '</div>';
    }).join('') + '</div></div>';

    h += '<div class="card pad"><div class="sec">Как это работает</div>' +
      '<div style="font-size:14px;line-height:1.5;color:#3D434C">' +
      'Строки только дописываются в конец листа — ничего не стирается и не перезаписывается.<br>' +
      'Дубли отсеиваются: то, что уже есть в листе, повторно не ляжет.<br>' +
      'После возврата отчёт и выгрузка пересобираются сами.</div></div>';

    h += '<button class="btn" onclick="askRestore()">Вернуть отмеченные строки</button>';
    el.innerHTML = h;
  }).catch(fail);
}

function toggleItems(i) {
  var el = document.getElementById('it' + i);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function pickedKeys() {
  var out = [];
  Array.prototype.forEach.call(document.querySelectorAll('input[data-key]'), function (c) {
    if (c.checked) out.push(c.getAttribute('data-key'));
  });
  return out;
}

function askRestore() {
  var keys = pickedKeys();
  if (!keys.length) return alert('Ничего не отмечено');
  var d = S.scan, n = 0, names = [];
  d.stores.forEach(function (s) {
    if (keys.indexOf(s.key) < 0) return;
    n += s.missing;
    names.push(s.label);
  });
  confirmSheet({
    title: 'Вернуть ' + n + ' строк?',
    sub: d.dirTitle + ', ' + d.date + ' · ' + names.join(', '),
    what: ['Добавится ' + n + ' строк в конец листа «' + d.sheet + '»',
           'Ничего не удаляется и не перезаписывается',
           'Запись в «Журнал дій»'],
    yes: 'Да, вернуть',
    run: function () { return call('restoreApply', { dir: d.dir, date: d.date, keys: keys }); },
    done: function (r) { toast('Возвращено строк: ' + r.added); loadRestore(d.dir); }
  });
}

// ================= ЖУРНАЛ =================
function loadLog() {
  setHead('Журнал', 'последние действия', false);
  spin();
  call('log').then(function (list) {
    if (!list.length) return view('<div class="note">Пока пусто</div>');
    view('<div class="card">' + list.map(function (r) {
      return '<div class="row"><span class="grow"><span style="font-size:15px;font-weight:600">' +
        esc(r.what) + '</span><span class="mut">' + esc(r.details) + '</span></span>' +
        '<span class="mut" style="flex:none">' + esc(r.when) + '</span></div>';
    }).join('') + '</div>');
  }).catch(fail);
}

if (TOKEN) start();
</script>
